name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck respeta el shebang de cada script: deploy.sh (#!/bin/sh) se
      # analiza como POSIX sh y entrypoint.sh (#!/usr/bin/env bash) como bash.
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          # -x hace que shellcheck SIGA las directivas `# shellcheck source=`.
          # Sin él la acción revisa fichero a fichero y esas directivas son
          # inertes: no comprueban nada y dan la falsa impresión de cubrir el
          # `source` de mint.sh. Verificar con `shellcheck *.sh` en local no lo
          # delata, porque pasando todos los ficheros a la vez sí los sigue.
          additional_arguments: -x

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Containerfile
          failure-threshold: error

  # Todo lo que la imagen COPIA dentro tiene que disparar su reconstrucción. Si
  # un fichero entra en la imagen y no está en el `paths:` de build-image.yml, un
  # cambio suyo se queda en main SIN LLEGAR NUNCA A UN RUNNER, y en silencio: no
  # falla nada, el commit está mergeado, el CI verde, y la imagen vieja.
  #
  # Ya pasó: `vigilar.sh` y `latido.sh` entraron en la imagen al containerizar el
  # vigía, nadie los añadió al `paths:`, y cuatro PRs seguidos que solo tocaban
  # esos scripts no reconstruyeron nada. El vigía en producción siguió con la
  # primera versión durante horas — sin ningún síntoma más que un nombre raro en
  # el panel de avisos.
  #
  # El comentario en build-image.yml ya avisaba de esto y no bastó, así que la
  # lista se comprueba, no se recuerda.
  imagen-al-dia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Todo lo que la imagen COPIA dispara su rebuild
        run: |
          python3 - <<'PY'
          import re, sys, yaml

          # Origen de cada COPY (todos los argumentos menos el destino), saltando
          # las opciones (--chown=…) y los COPY --from=… de otra etapa.
          copiados = set()
          for linea in open('Containerfile'):
              if not re.match(r'\s*COPY\s', linea, re.I):
                  continue
              args = [a for a in linea.split()[1:] if not a.startswith('--')]
              if '--from=' in linea:
                  continue
              copiados.update(args[:-1])

          disparan = set(
              yaml.safe_load(open('.github/workflows/build-image.yml'))
              [True]['push']['paths']            # `on:` lo parsea YAML como True
          )

          # Un patrón del paths: puede cubrir varios ficheros (no los hay hoy,
          # pero que un glob futuro no dé un falso positivo).
          import fnmatch
          faltan = sorted(
              f for f in copiados
              if not any(fnmatch.fnmatch(f, p) for p in disparan)
          )
          if faltan:
              print('FALLO: estos ficheros entran en la imagen pero NO disparan su rebuild:')
              for f in faltan:
                  print(f'  - {f}')
              print('\nAñádelos al `paths:` de .github/workflows/build-image.yml.')
              print('Sin eso, cambiarlos NO llega a ningún runner y no lo notarías.')
              sys.exit(1)
          print('ok: los %d ficheros de la imagen disparan su rebuild' % len(copiados))
          PY

  # El vigía no tiene forma de fallar en rojo por sí solo (avisa, no rompe), así
  # que su regresión sería SILENCIOSA: creerías tener vigilancia sin tenerla.
  # Esto fija su comportamiento con casos reales, empezando por el fallo que lo
  # motivó (runner "Up" pero atascado en "Retrying until reconnected").
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Los hooks acaban en .ejemplo, así que la acción de shellcheck no los
      # detecta por extensión; se analizan aquí explícitamente.
      - name: shellcheck de los hooks de ejemplo
        run: shellcheck --severity=warning --shell=sh hooks/*.ejemplo

      # Es lo que permite aprovisionar un host copiando UN fichero en vez de
      # editar cada hook a mano. Si se rompiera, los hooks volverían al valor de
      # ejemplo y mandarían los avisos a la nada — en silencio.
      - name: Los hooks leen su configuración de un fichero aparte
        run: |
          set -eu
          d="$RUNNER_TEMP/conf"; rm -rf "$d"; mkdir -p "$d"
          cp hooks/10-healthchecks.sh.ejemplo "$d/10.sh"
          cp hooks/20-telegram.sh.ejemplo     "$d/20.sh"
          chmod +x "$d"/*.sh
          cat > "$d/avisos.conf" <<'CONF'
          HC_URL='https://hc-ping.com/UUID-DEL-FICHERO'
          TG_TOKEN='777:TOKEN-DEL-FICHERO'
          TG_CHAT='-100777'
          CONF
          # curl falso: registra a dónde habría ido cada petición.
          mkdir -p "$d/bin"
          printf '#!/bin/sh\nfor a in "$@"; do case "$a" in https://*) echo "$a" >> %s/red.log ;; esac; done\n' "$d" > "$d/bin/curl"
          chmod +x "$d/bin/curl"

          cd "$d"
          PATH="$d/bin:$PATH" VIGILAR_CONF="$d/avisos.conf" \
            VIGILAR_ESTADO=degradado VIGILAR_CAMBIO=si VIGILAR_HOST=ci \
            sh -c 'printf "informe\n" | ./10.sh; printf "informe\n" | ./20.sh'

          grep -q 'UUID-DEL-FICHERO'  red.log || { echo "FALLO: healthchecks ignoró el fichero"; exit 1; }
          grep -q 'TOKEN-DEL-FICHERO' red.log || { echo "FALLO: telegram ignoró el fichero"; exit 1; }
          grep -q '00000000-0000'     red.log && { echo "FALLO: usó el valor de ejemplo"; exit 1; }
          echo "ok: los hooks toman sus valores del fichero de configuración"

      - name: healthcheck.sh distingue atascado de sano
        run: |
          set -eu
          d="$RUNNER_TEMP/hc"; rm -rf "$d"; mkdir -p "$d/_diag"
          export RUNNER_DIAG_DIR="$d/_diag"
          ahora="$(date -u '+%Y-%m-%d %H:%M:%S')"
          viejo="$(date -u -d '-30 minutes' '+%Y-%m-%d %H:%M:%S')"
          probar() {  # $1 = esperado, $2 = descripción
            rc=0; ./healthcheck.sh >/dev/null 2>&1 || rc=$?
            [ "$rc" = "$1" ] || { echo "FALLO ($2): rc=$rc, esperaba $1"; exit 1; }
            echo "ok: $2"
          }
          probar 0 'sin log todavía (arranque) => sano'

          printf '[%sZ INFO Listener] Listening for Jobs\n' "$ahora" > "$d/_diag/Runner_x.log"
          probar 0 'escuchando => sano'

          printf '[%sZ INFO Listener] Running job: unit\n' "$ahora" > "$d/_diag/Runner_x.log"
          probar 0 'ejecutando un job => sano (no exige estar escuchando)'

          # El fallo del 1-ago-2026, reproducido tal cual salió en el log.
          printf '[%sZ ERR  Listener] Runner connect error: The token expired on 11:21:01. Current server time is 11:48:06. Retrying until reconnected.\n' "$ahora" >> "$d/_diag/Runner_x.log"
          probar 1 'atascado reconectando => unhealthy'

          printf '[%sZ ERR  Listener] Retrying until reconnected.\n[%sZ INFO Listener] Listening for Jobs\n' "$viejo" "$ahora" > "$d/_diag/Runner_x.log"
          probar 0 'error ya superado (fuera de ventana) => sano'

          printf '[%sZ ERR  Worker] Runner connect error: falla el JOB\n' "$ahora" > "$d/_diag/Worker_y.log"
          printf '[%sZ INFO Listener] Listening for Jobs\n' "$ahora" > "$d/_diag/Runner_x.log"
          probar 0 'un job que falla NO es un runner enfermo'
          rm -f "$d/_diag/Worker_y.log"

          # Reconexión DENTRO de la ventana. El caso de arriba solo cubre el error
          # que ya salió de los 5 min; este es el que mandaba la falsa alarma:
          # 15:38:17 Conflict -> 15:39:21 reconectado -> 15:43:13 el vigía seguía
          # diciendo "atascado" con los cuatro runners tomando jobs.
          printf '[%sZ ERR  Listener] Runner connect error: Error: Conflict. Retrying until reconnected.\n[%sZ INFO Listener] Runner reconnected.\n[%sZ INFO Listener] Listening for Jobs\n' \
            "$ahora" "$ahora" "$ahora" > "$d/_diag/Runner_x.log"
          probar 0 'se reconectó dentro de la ventana => sano'

          # La otra mitad: si el error viene DESPUÉS de la última señal buena, el
          # runner se volvió a caer y hay que reportarlo. Sin esto, bastaría un
          # "Listening for Jobs" viejo para enmudecer la alarma para siempre.
          printf '[%sZ INFO Listener] Listening for Jobs\n[%sZ ERR  Listener] Retrying until reconnected.\n' \
            "$ahora" "$ahora" > "$d/_diag/Runner_x.log"
          probar 1 'cayó DESPUÉS de reconectar => unhealthy'

      - name: latido.sh publica el estado del runner
        run: |
          set -eu
          d="$RUNNER_TEMP/lat"; rm -rf "$d"; mkdir -p "$d/latidos"
          printf '#!/bin/sh\nexit 0\n' > "$d/sano";  chmod +x "$d/sano"
          printf '#!/bin/sh\necho "atascado reconectando con GitHub"\nexit 1\n' > "$d/malo"; chmod +x "$d/malo"

          lat() {  # $1 = check, $2 = marca de config, $3 = nombre
            LATIDO_DIR="$d/latidos" LATIDO_CADA=1 LATIDO_HEALTHCHECK="$1" \
            LATIDO_MARCA_CONFIG="$2" RUNNER_NAME="$3" \
              timeout 2 sh ./latido.sh 2>/dev/null || true
          }

          # Sin .runner: el runner sigue arrancando (backoff o config.sh). Es un
          # estado NORMAL: sin nombrarlo, un runner que se recupera parecería muerto.
          lat "$d/sano" "$d/no-existe" r-arranca
          grep -q ' arrancando ' "$d/latidos/r-arranca" \
            || { echo "FALLO: sin .runner debería ser 'arrancando'"; cat "$d/latidos/r-arranca"; exit 1; }

          touch "$d/dot-runner"
          lat "$d/sano" "$d/dot-runner" r-sano
          grep -q ' sano ' "$d/latidos/r-sano" || { echo "FALLO: debería ser sano"; exit 1; }

          lat "$d/malo" "$d/dot-runner" r-malo
          grep -q 'atascado reconectando con GitHub' "$d/latidos/r-malo" \
            || { echo "FALLO: el motivo de healthcheck.sh no llega al latido"; exit 1; }

          # Escritura atómica: el vigía lee en cualquier momento y no debe pillar
          # media línea. No pueden quedar temporales.
          ls -A "$d/latidos" | grep -q '^\.tmp' && { echo "FALLO: quedó un temporal"; exit 1; }
          echo "ok: latido publica arrancando / sano / atascado, sin dejar temporales"

      - name: vigilar.sh lee los latidos, no el motor de contenedores
        run: |
          set -eu
          d="$RUNNER_TEMP/vg"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks"
          now="$(date -u +%s)"

          # sano · atascado · rancio (contenedor parado) · arrancando · huérfano.
          # r-5 no tiene fichero: nunca ha latido.
          # Formato: <epoch> <estado> <ocupado|libre> <disco%|-> <ultimo_job|-> <motivo…>
          printf '%s sano libre 30 %s \n'                "$now" "$now"      > "$d/latidos/r-1"
          printf '%s atascado libre 30 - no conecta con GitHub\n' "$now"    > "$d/latidos/r-2"
          printf '%s sano ocupado 30 %s \n'  "$((now - 900))" "$((now-900))" > "$d/latidos/r-3"
          printf '%s arrancando libre - - \n'            "$now"             > "$d/latidos/r-4"
          printf '%s sano libre 30 %s \n'                "$now" "$now"      > "$d/latidos/r-viejo"

          V="VIGIA_LATIDOS=$d/latidos VIGIA_HOOKS=$d/hooks VIGIA_ESTADO_FILE=$d/estado VIGIA_CLUSTER=ci VIGIA_DESFASE_MAX=999999"
          informe="$(env $V VIGIA_RUNNERS='r-1 r-2 r-3 r-4 r-5' sh ./vigilar.sh --informe)"
          echo "$informe"

          echo "$informe" | grep -q 'no conecta con GitHub' || { echo "FALLO: el motivo del atasco no llega"; exit 1; }
          echo "$informe" | grep -q 'sin latido desde hace' || { echo "FALLO: el latido rancio no se detecta"; exit 1; }
          echo "$informe" | grep -q 'nunca ha latido'       || { echo "FALLO: el runner sin fichero no se detecta"; exit 1; }
          echo "$informe" | grep -q 'arrancando'            || { echo "FALLO: falta el estado arrancando"; exit 1; }
          echo "$informe" | grep -q '1/5'                   || { echo "FALLO: el recuento no cuadra"; exit 1; }
          echo "$informe" | grep -q 'Fleet ci'              || { echo "FALLO: falta la identidad del cluster"; exit 1; }

          # Al bajar de 6 runners a 5, el latido que sobra no debe alarmar.
          [ -f "$d/latidos/r-viejo" ] && { echo "FALLO: el latido huérfano sigue ahí"; exit 1; }
          echo "ok: lee latidos, distingue los cinco casos y limpia huérfanos"

      # El criterio no es cuántos fallan, sino si la CI sigue corriendo. Colapsarlo
      # a binario obliga a elegir entre gritar por un runner de tres o callar
      # cuando ya no queda ninguno.
      - name: Tres niveles de estado según si la CI sigue viva
        run: |
          set -eu
          d="$RUNNER_TEMP/niv"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks"
          printf '#!/bin/sh\necho "$VIGILAR_ESTADO" > %s/nivel\ncat > /dev/null\n' "$d" > "$d/hooks/10-n"
          chmod +x "$d/hooks/10-n"

          nivel() {  # $1 = sanos, $2 = censo, $3 = minimo
            rm -f "$d"/latidos/* "$d/estado"
            now="$(date -u +%s)"
            for n in $1; do printf '%s sano libre 30 %s \n' "$now" "$now" > "$d/latidos/$n"; done
            env VIGIA_LATIDOS="$d/latidos" VIGIA_HOOKS="$d/hooks" VIGIA_ESTADO_FILE="$d/estado" \
                VIGIA_DESFASE_MAX=999999 VIGIA_RUNNERS="$2" VIGIA_MINIMO="$3" \
                sh ./vigilar.sh >/dev/null 2>&1
            cat "$d/nivel"
          }

          [ "$(nivel 'a b c' 'a b c' 1)" = sano ]      || { echo "FALLO: todos sanos debería ser sano"; exit 1; }
          [ "$(nivel 'a b'   'a b c' 1)" = parcial ]   || { echo "FALLO: con la CI viva debería ser parcial"; exit 1; }
          [ "$(nivel ''      'a b c' 1)" = degradado ] || { echo "FALLO: sin ninguno debería ser degradado"; exit 1; }
          [ "$(nivel 'a'     'a b c' 2)" = degradado ] || { echo "FALLO: por debajo del mínimo debería ser degradado"; exit 1; }
          echo "ok: sano / parcial / degradado, y VIGIA_MINIMO manda"

      # Un reloj desviado con los runners «sanos» es el fallo del 1 de agosto: todo
      # figuraba Up y nada tomaba jobs. Tiene que ir a rojo por sí solo.
      - name: El reloj desfasado es degradado aunque los runners se declaren sanos
        run: |
          set -eu
          d="$RUNNER_TEMP/rel"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks" "$d/bin"
          printf '%s sano libre 30 %s \n' "$(date -u +%s)" "$(date -u +%s)" > "$d/latidos/a"
          # curl falso: GitHub va 30 minutos por delante.
          printf '#!/bin/sh\nprintf "HTTP/2 200\\r\\nDate: %%s\\r\\n\\r\\n" "$(date -u -d "+30 minutes" "+%%a, %%d %%b %%Y %%H:%%M:%%S GMT")"\n' > "$d/bin/curl"
          chmod +x "$d/bin/curl"
          printf '#!/bin/sh\necho "$VIGILAR_ESTADO" > %s/nivel\ncat > /dev/null\n' "$d" > "$d/hooks/10-n"
          chmod +x "$d/hooks/10-n"

          informe="$(PATH="$d/bin:$PATH" env VIGIA_LATIDOS="$d/latidos" VIGIA_HOOKS="$d/hooks" \
                     VIGIA_ESTADO_FILE="$d/estado" VIGIA_RUNNERS=a sh ./vigilar.sh)"
          echo "$informe"
          echo "$informe" | grep -q 'DESFASADO' || { echo "FALLO: no nombró el desfase"; exit 1; }
          [ "$(cat "$d/nivel")" = degradado ]   || { echo "FALLO: el reloj desviado debe ser degradado"; exit 1; }
          echo "ok: el reloj desfasado enciende la alarma por su cuenta"

      - name: Hooks aislados, anti-spam y primera ronda
        run: |
          set -eu
          d="$RUNNER_TEMP/hk"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks"
          printf '%s sano libre 30 %s \n' "$(date -u +%s)" "$(date -u +%s)" > "$d/latidos/a"

          # Uno que habla siempre (latido), otro solo si cambió (Telegram), otro
          # que revienta y otro que se cuelga: los dos últimos NO pueden impedir
          # que los primeros hablen.
          printf '#!/bin/sh\n{ echo "LATIDO $VIGILAR_ESTADO $VIGILAR_CAMBIO primera=$VIGILAR_PRIMERA cluster=$VIGILAR_CLUSTER"; cat; } >> %s/log\n' "$d" > "$d/hooks/10-latido"
          printf '#!/bin/sh\n[ "$VIGILAR_CAMBIO" = si ] || exit 0\necho "TELEGRAM" >> %s/log\n' "$d" > "$d/hooks/20-tg"
          printf '#!/bin/sh\nexit 7\n' > "$d/hooks/30-roto"
          printf '#!/bin/sh\nsleep 300\n' > "$d/hooks/40-colgado"
          printf '#!/bin/sh\necho NO-DEBE-CORRER >> %s/log\n' "$d" > "$d/hooks/50-sin-permiso"
          chmod +x "$d/hooks/10-latido" "$d/hooks/20-tg" "$d/hooks/30-roto" "$d/hooks/40-colgado"

          V="VIGIA_LATIDOS=$d/latidos VIGIA_HOOKS=$d/hooks VIGIA_ESTADO_FILE=$d/estado VIGIA_CLUSTER=ci VIGIA_DESFASE_MAX=999999 VIGIA_RUNNERS=a"
          informe="$(env $V sh ./vigilar.sh)"
          env $V sh ./vigilar.sh >/dev/null 2>&1   # segunda ronda: nada cambió

          grep -q 'NO-DEBE-CORRER' "$d/log" && { echo "FALLO: corrió un hook sin permiso de ejecución"; exit 1; }
          # Y no basta con no ejecutarlo: hay que DECIRLO, o creerías tener avisos
          # que no tienes. El bit de ejecución puede no sobrevivir a un bind mount
          # desde Windows.
          echo "$informe" | grep -q '50-sin-permiso' || { echo "FALLO: el hook ignorado no se nombra en el informe"; exit 1; }

          [ "$(grep -c '^LATIDO' "$d/log")" = 2 ]   || { echo "FALLO: el latido debe sonar en CADA ronda"; exit 1; }
          [ "$(grep -c '^TELEGRAM' "$d/log")" = 1 ] || { echo "FALLO: el aviso debe callar si nada cambió"; exit 1; }
          grep -q 'primera=si' "$d/log" || { echo "FALLO: la 1ª ronda no se marca"; exit 1; }
          grep -q 'primera=no' "$d/log" || { echo "FALLO: la 2ª ronda sigue marcada como primera"; exit 1; }
          grep -q 'cluster=ci' "$d/log" || { echo "FALLO: la identidad del cluster no llega al hook"; exit 1; }
          echo "ok: hooks aislados, anti-spam, primera ronda e identidad de cluster"

      # El hook es quien decide si suena la alarma. Si esto se rompe, el vigía
      # seguiría funcionando y los avisos irían al sitio equivocado en silencio.
      - name: El hook de healthchecks.io elige URL y sufijo por nivel
        run: |
          set -eu
          d="$RUNNER_TEMP/hc"; rm -rf "$d"; mkdir -p "$d/bin"
          printf '#!/bin/sh\nfor a in "$@"; do case "$a" in http*) echo "$a" >> %s/red ;; esac; done\n' "$d" > "$d/bin/curl"
          chmod +x "$d/bin/curl"
          cp hooks/10-healthchecks.sh.ejemplo "$d/hc.sh"; chmod +x "$d/hc.sh"

          ping() {  # $1 = estado, $2 = conf extra
            : > "$d/red"
            { printf "HC_PING_KEY='PK'\n"; printf '%s\n' "$2"; } > "$d/conf"
            printf 'informe\n' | PATH="$d/bin:$PATH" env VIGILAR_CONF="$d/conf" \
              VIGILAR_ESTADO="$1" VIGILAR_CLUSTER=sherman VIGILAR_HOST=ci sh "$d/hc.sh" 2>/dev/null
            grep -v '/api/v3/' "$d/red" | head -1
          }

          [ "$(ping sano '')"      = 'https://hc-ping.com/PK/sherman-ci?create=1' ]      || { echo "FALLO: sano"; ping sano ''; exit 1; }
          [ "$(ping degradado '')" = 'https://hc-ping.com/PK/sherman-ci/fail?create=1' ] || { echo "FALLO: degradado"; exit 1; }
          # `parcial` manda /fail MIENTRAS no se verifique que /log no reinicia la
          # cuenta atrás: si no la reiniciara, un fleet a medio morir se quedaría
          # en silencio para siempre. Se cambia con HC_SUFIJO_PARCIAL.
          [ "$(ping parcial '')"   = 'https://hc-ping.com/PK/sherman-ci/fail?create=1' ] || { echo "FALLO: parcial por defecto"; exit 1; }
          [ "$(ping parcial "HC_SUFIJO_PARCIAL='/log'")" = 'https://hc-ping.com/PK/sherman-ci/log?create=1' ] || { echo "FALLO: parcial con /log"; exit 1; }

          # El slug lleva cluster Y MÁQUINA. Dos clusters de un mismo host, y el
          # MISMO cluster en hosts distintos, tienen que pingear checks separados:
          # si comparten uno, el latido sano de cualquiera lo mantiene verde
          # aunque el otro esté muerto. Y como el README manda usar el mismo
          # comando en todas las máquinas, el nombre de directorio repetido es el
          # caso NORMAL, no el raro.
          slug() {  # $1 = cluster, $2 = host
            : > "$d/red"; printf "HC_PING_KEY='PK'\n" > "$d/conf"
            printf 'informe\n' | PATH="$d/bin:$PATH" env VIGILAR_CONF="$d/conf" \
              VIGILAR_ESTADO=sano VIGILAR_CLUSTER="$1" VIGILAR_HOST="$2" sh "$d/hc.sh" 2>/dev/null
            grep -v '/api/v3/' "$d/red" | head -1
          }
          # Un check autocreado sin API key se queda con el periodo por defecto de
          # healthchecks.io (1 día): sale verde y NO vigila. Pasó de verdad, con una
          # de las dos máquinas del fleet. `configurar-avisos.sh` ya lo advierte al
          # dar de alta, pero eso ocurre una vez y se va con el scroll; esto lo
          # repite en cada latido, en el cuerpo que el panel enseña.
          cuerpo() {  # $1 = conf extra -> lo que el hook manda como cuerpo del ping
            : > "$d/cuerpo"
            { printf "HC_PING_KEY='PK'\n"; printf '%s\n' "$1"; } > "$d/conf"
            printf 'informe\n' | PATH="$d/bin2:$PATH" env VIGILAR_CONF="$d/conf" \
              VIGILAR_ESTADO=sano VIGILAR_CLUSTER=sherman VIGILAR_HOST=ci sh "$d/hc.sh" 2>/dev/null
            cat "$d/cuerpo"
          }
          # curl falso que además guarda stdin: el cuerpo viaja por --data-binary @-,
          # así que el de arriba (solo URLs) no lo vería.
          mkdir -p "$d/bin2"
          printf '#!/bin/sh\ncase "$*" in *api/v3*) exit 0 ;; esac\ncat >> %s/cuerpo\n' "$d" > "$d/bin2/curl"
          chmod +x "$d/bin2/curl"

          cuerpo '' | grep -q 'NO está configurado' \
            || { echo "FALLO: sin API key, el cuerpo no avisa de que el check está sin configurar"; cuerpo ''; exit 1; }
          cuerpo '' | grep -q 'informe' \
            || { echo "FALLO: el aviso se comió el informe"; exit 1; }
          # Con la clave puesta el aviso desaparece: si no, sería permanente y se
          # acabaría ignorando, que es como se pierde una alarma.
          cuerpo "HC_API_KEY='AK'" | grep -q 'NO está configurado' \
            && { echo "FALLO: con API key el aviso debería desaparecer"; exit 1; }
          # Con HC_URL el check lo eligió una persona: su periodo no es cosa nuestra.
          cuerpo "HC_URL='https://hc-ping.com/UUID'" | grep -q 'NO está configurado' \
            && { echo "FALLO: con HC_URL no hay auto-provisión, no debe avisar"; exit 1; }
          echo "ok: el hook avisa de su propio check sin configurar, y solo cuando toca"

          a="$(slug runners mmJA)"; b="$(slug runners otroMac)"; c="$(slug otro mmJA)"
          [ "$a" != "$b" ] || { echo "FALLO: el MISMO cluster en dos hosts comparte check: $a"; exit 1; }
          [ "$a" != "$c" ] || { echo "FALLO: dos clusters de un host comparten check: $a"; exit 1; }
          echo "$a" | grep -q 'runners-mmja' || { echo "FALLO: el slug no lleva cluster y host: $a"; exit 1; }

          # HC_URL sigue mandando: es lo que ya funcionaba y no debe romperse.
          : > "$d/red"; printf "HC_URL='https://hc-ping.com/UUID'\nHC_PING_KEY='PK'\n" > "$d/conf"
          printf 'informe\n' | PATH="$d/bin:$PATH" env VIGILAR_CONF="$d/conf" VIGILAR_ESTADO=sano \
            VIGILAR_CLUSTER=sherman sh "$d/hc.sh" 2>/dev/null
          [ "$(head -1 "$d/red")" = 'https://hc-ping.com/UUID' ] || { echo "FALLO: HC_URL debería tener prioridad"; exit 1; }
          echo "ok: sufijo por nivel, slug por cluster y compatibilidad con HC_URL"


      # EL TEST QUE FALTABA. Los demás comprueban la URL con un curl simulado, y
      # así se colo que `--data-raw @-` manda los dos caracteres «@-» en vez del
      # informe: un stub no reproduce como interpreta curl la @, asi que las tres
      # variantes parecian iguales. Aqui se levanta un servidor de verdad y se
      # mira QUE LLEGA. Sin cuerpo, el reenvio a Telegram no lleva nada y todo el
      # diseno de "el informe viaja en el ping" queda en nada.
      - name: El informe llega ÍNTEGRO en el cuerpo del ping (curl real)
        run: |
          set -eu
          d="$RUNNER_TEMP/cuerpo"; rm -rf "$d"; mkdir -p "$d"
          # Con API key A PROPÓSITO: es el despliegue bien configurado, y así el
          # hook no antepone su aviso de "este check nació con periodo de 1 día"
          # y la comparación de abajo puede seguir siendo BYTE A BYTE, que es lo
          # que caza un cuerpo sutilmente estropeado. Que el informe sobreviva al
          # aviso cuando NO hay clave lo cubre el test del hook, más arriba.
          # HC_API apunta al mismo servidor de prueba: sin eso, la llamada de
          # configuración saldría a healthchecks.io de verdad desde CI.
          printf "HC_PING_KEY='PK'\nHC_BASE='http://127.0.0.1:8097'\nHC_API_KEY='AK'\nHC_API='http://127.0.0.1:8097/api/v3'\n" > "$d/conf"

          python3 - "$d" <<'PY'
          import http.server, threading, subprocess, sys, time, pathlib
          d = pathlib.Path(sys.argv[1])
          cuerpos = []

          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  cuerpo = self.rfile.read(int(self.headers.get('Content-Length', 0))).decode()
                  # La llamada de configuración del check (Management API) manda
                  # JSON y llega ANTES que el ping. Se descarta aquí para que
                  # cuerpos[0] siga siendo el informe y no el JSON.
                  if '/api/v3/' not in self.path:
                      cuerpos.append(cuerpo)
                  self.send_response(200); self.end_headers(); self.wfile.write(b'OK')
              def log_message(self, *a): pass

          srv = http.server.HTTPServer(('127.0.0.1', 8097), H)
          threading.Thread(target=srv.serve_forever, daemon=True).start()

          # Con acentos, varias líneas y espacios de alineación: es lo que hace
          # legible la tabla en el móvil y lo primero que se pierde si el flag
          # de curl es el equivocado.
          informe = ("Fleet sherman-ci — 3/4 en línea\n\n"
                     "DEGRADADO\n  gh-1   atascado   no conecta con GitHub\n\n"
                     "EN LÍNEA\n  gh-2   sano       libre\n\n"
                     "Reloj: +2 s vs GitHub")

          subprocess.run(["sh", "hooks/10-healthchecks.sh.ejemplo"],
                         input=informe.encode(), capture_output=True,
                         env={"VIGILAR_CONF": str(d / "conf"), "VIGILAR_ESTADO": "sano",
                              "VIGILAR_CLUSTER": "sherman", "VIGILAR_HOST": "ci",
                              "PATH": "/usr/bin:/bin:/usr/local/bin"})
          time.sleep(0.3)

          if not cuerpos:
              print("FALLO: no llegó ningún ping"); sys.exit(1)
          got = cuerpos[0].strip()
          if got == "@-":
              print("FALLO: llegó el literal '@-'. --data-raw NO interpreta la @;"
                    " usa --data-binary @-"); sys.exit(1)
          if "\n" not in got:
              print("FALLO: llegó sin saltos de línea (¿--data en vez de"
                    " --data-binary?): %r" % got); sys.exit(1)
          if got != informe.strip():
              print("FALLO: el cuerpo no coincide.\nesperado: %r\nrecibido: %r"
                    % (informe.strip(), got)); sys.exit(1)
          print("ok: el informe llega íntegro, con acentos y con la tabla alineada")
          PY

      # `?create=1` crea el check con periodo de 1 DÍA: parecería vigilado y un
      # host caído tardaría un día en avisar. La Management API lo corrige.
      - name: Con API key, el vigía configura su propio check
        run: |
          set -eu
          d="$RUNNER_TEMP/api"; rm -rf "$d"; mkdir -p "$d/bin"
          cat > "$d/bin/curl" <<'STUB'
          #!/bin/sh
          _b=""; _n=0
          for a in "$@"; do
            [ "$_n" = 1 ] && { _b="$a"; _n=0; }
            [ "$a" = "--data-raw" ] && _n=1
          done
          case "$*" in *api/v3/checks*) printf '%s' "$_b" > "$API_OUT" ;; esac
          exit 0
          STUB
          chmod +x "$d/bin/curl"
          cp hooks/10-healthchecks.sh.ejemplo "$d/hc.sh"; chmod +x "$d/hc.sh"
          printf "HC_PING_KEY='PK'\nHC_API_KEY='AK'\n" > "$d/conf"

          # Un hostname con comillas rompería el JSON hecho a mano en shell.
          printf 'informe\n' | PATH="$d/bin:$PATH" API_OUT="$d/api.json" env VIGILAR_CONF="$d/conf" \
            VIGILAR_ESTADO=sano VIGILAR_CLUSTER=sherman VIGILAR_HOST='ma"l"o' VIGILAR_ESPERADOS=3 \
            sh "$d/hc.sh" 2>/dev/null

          python3 - "$d/api.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))          # falla si el escapado se rompió
          # El slug lleva cluster Y host; el host hostil se sanea sin romper el JSON.
          assert d["slug"].startswith("sherman-"), d
          assert d["unique"] == ["slug"], d
          # Derivados de la cadencia: periodo = 2 rondas, margen = 1 ronda. Con la
          # cadencia por defecto (300 s) avisa entre los 10 y los 15 minutos. Un
          # valor mas alto suena prudente y no lo es: el fleet ES la CI.
          assert d["timeout"] == 600 and d["grace"] == 300, ("umbrales no derivados de la cadencia", d)
          assert d["methods"] == "POST", ("un GET no debe marcar el check como vivo", d)
          assert "cluster:sherman" in d["tags"], d
          print("ok: upsert idempotente, periodo corregido y methods=POST")
          PY


      # El nombre del fleet es UNO. Iban por caminos separados: `--prefix sherman`
      # renombraba los runners pero el check seguia llamandose como el directorio,
      # asi que no habia forma de arreglar uno sin desalinear el otro. Y el host se
      # anade solo a los dos, asi que meterlo en el nombre lo repite.
      - name: Un solo nombre para runners y check, y el host no se repite
        run: |
          set -eu
          d="$RUNNER_TEMP/nom"; rm -rf "$d"
          # Mismo saneado que deploy.sh, y SIN `cut`: cut anade su propio salto de
          # linea y `tr -c` lo convertiria en '-', dejando el nombre esperado con
          # un guion de mas.
          host="$(hostname 2>/dev/null || echo runner)"
          host="${host%%.*}"
          host="$(printf '%s' "$host" | tr -c 'A-Za-z0-9_-' '-')"

          nombres() {  # $1 = directorio, $2… = flags
            mkdir -p "$d/$1"; ( cd "$d/$1"; rm -f compose.yaml .env
              shift
              # shellcheck disable=SC2086
              sh "$GITHUB_WORKSPACE/deploy.sh" --no-up --skip-validation --token F \
                 --repo o/r --count 1 --vigilar $* > "$d/salida" 2>&1
              python3 -c "
          import yaml
          d = yaml.safe_load(open('compose.yaml'))
          e = d['services']['vigia']['environment']
          print(d['services']['runner-1']['environment']['RUNNER_NAME'], e['VIGIA_CLUSTER'], e['VIGIA_HOST'])" )
          }

          set -- $(nombres proyecto)
          [ "$1" = "proyecto-${host}-1" ] || { echo "FALLO: runner '$1'"; exit 1; }
          [ "$2-$3" = "proyecto-${host}" ] || { echo "FALLO: check '$2-$3'"; exit 1; }

          # --prefix tiene que mover LOS DOS. Este es el caso que estaba roto.
          set -- $(nombres otro-directorio --prefix sherman)
          [ "$1" = "sherman-${host}-1" ] || { echo "FALLO: --prefix no llegó al runner: '$1'"; exit 1; }
          [ "$2" = "sherman" ] || { echo "FALLO: --prefix no llegó al cluster: '$2'"; exit 1; }
          echo "ok: un solo nombre gobierna runners y check"

          # El host se anade solo; si ya esta en el nombre, sale repetido y hay que
          # decirlo — antes era la unica forma de distinguir maquinas y se arrastra.
          nombres "proyecto-${host}" >/dev/null
          grep -q 'AVISO: el nombre del cluster' "$d/salida" \
            || { echo "FALLO: no avisó del host repetido en el nombre"; cat "$d/salida"; exit 1; }
          echo "ok: avisa cuando el nombre del cluster ya lleva la máquina"

      # `hostname` DENTRO del contenedor devuelve su ID, que ademas cambia en cada
      # recreate. Como ese valor forma parte del nombre del check, deducirlo daria
      # un check nuevo cada vez que se recrea el vigia.
      - name: El host se pasa al vigía, no se deduce dentro del contenedor
        run: |
          set -eu
          d="$RUNNER_TEMP/vh"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks"; cd "$d"
          printf '%s sano libre 30 %s \n' "$(date -u +%s)" "$(date -u +%s)" > latidos/a
          informe="$(VIGIA_LATIDOS="$d/latidos" VIGIA_HOOKS="$d/hooks" VIGIA_ESTADO_FILE="$d/e" \
                     VIGIA_RUNNERS=a VIGIA_CLUSTER=sherman VIGIA_HOST=elmac VIGIA_DESFASE_MAX=999999 \
                     sh "$GITHUB_WORKSPACE/vigilar.sh" --informe)"
          echo "$informe" | grep -q 'Máquina: elmac' \
            || { echo "FALLO: no usó VIGIA_HOST"; echo "$informe"; exit 1; }
          _hn="$(hostname 2>/dev/null || echo x)"; _hn="${_hn%%.*}"
          echo "$informe" | grep -q "Máquina: ${_hn}" \
            && { echo "FALLO: dedujo el host en vez de usar el que le pasan"; exit 1; }
          echo "ok: el host viene dado, no deducido"


      # Dos fallos que NO se ven mirando el estado de los runners: todos dicen
      # "sano" mientras el disco se llena, y un runner mal etiquetado se queda
      # "sano · libre" para siempre porque nadie le manda trabajo.
      - name: Disco y último job viajan en el latido y salen en el informe
        run: |
          set -eu
          d="$RUNNER_TEMP/met"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks"
          now="$(date -u +%s)"
          V="VIGIA_LATIDOS=$d/latidos VIGIA_HOOKS=$d/hooks VIGIA_ESTADO_FILE=$d/e"
          V="$V VIGIA_CLUSTER=ci VIGIA_HOST=maq VIGIA_DESFASE_MAX=999999"

          # a: trabajó hace 2 h · b: trabajando ahora · c: NUNCA (etiqueta mala)
          printf '%s sano libre 40 %s \n'   "$now" "$((now - 7200))" > "$d/latidos/a"
          printf '%s sano ocupado 40 %s \n' "$now" "$now"            > "$d/latidos/b"
          printf '%s sano libre 40 - \n'    "$now"                   > "$d/latidos/c"

          informe="$(env $V VIGIA_RUNNERS='a b c' sh ./vigilar.sh --informe)"
          echo "$informe"
          echo "$informe" | grep -q 'job hace 2 h'  || { echo "FALLO: no sale la antigüedad del último job"; exit 1; }
          echo "$informe" | grep -q 'sin jobs aún'  || { echo "FALLO: no delata al runner que nunca trabajó"; exit 1; }
          echo "$informe" | grep -q 'Disco: 40%'    || { echo "FALLO: no sale el disco"; exit 1; }
          # Con un job en curso la antigüedad sobra: es ahora mismo.
          echo "$informe" | grep 'ocupado' | grep -q 'job hace' \
            && { echo "FALLO: repite la antigüedad en un runner ocupado"; exit 1; }
          echo "ok: último job por runner y disco en el informe"

          # El disco lleno empuja a `parcial`, no a `degradado`: la CI aún corre,
          # pero hay que actuar antes de que deje de hacerlo.
          printf '#!/bin/sh\necho "$VIGILAR_ESTADO" > %s/nivel\ncat > /dev/null\n' "$d" > "$d/hooks/10-n"
          chmod +x "$d/hooks/10-n"
          for r in a b c; do printf '%s sano libre 93 %s \n' "$now" "$now" > "$d/latidos/$r"; done
          rm -f "$d/e"
          informe="$(env $V VIGIA_RUNNERS='a b c' sh ./vigilar.sh)"
          echo "$informe" | grep -q 'DISCO AL 93%' || { echo "FALLO: no avisó del disco"; exit 1; }
          [ "$(cat "$d/nivel")" = parcial ] || { echo "FALLO: el disco lleno debería dar parcial, dio $(cat "$d/nivel")"; exit 1; }

          # Y por debajo del umbral NO alarma.
          for r in a b c; do printf '%s sano libre 40 %s \n' "$now" "$now" > "$d/latidos/$r"; done
          rm -f "$d/e"; env $V VIGIA_RUNNERS='a b c' sh ./vigilar.sh >/dev/null 2>&1
          [ "$(cat "$d/nivel")" = sano ] || { echo "FALLO: 40% no debería alarmar"; exit 1; }
          echo "ok: el disco lleno da parcial, y por debajo del umbral calla"

      - name: latido.sh mide el disco y arrastra el último job
        run: |
          set -eu
          d="$RUNNER_TEMP/lat2"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/libre" "$d/conjob/123"
          printf '#!/bin/sh\nexit 0\n' > "$d/ok"; chmod +x "$d/ok"; touch "$d/cfg"

          # /proc simulado. Hace falta porque este test corre DENTRO de un runner
          # de GitHub, que tiene su propio proceso Runner.Worker: mirando el /proc
          # de verdad, "no hay ningún job" es irreproducible aquí.
          printf '/home/runner/bin/Runner.Worker\0' > "$d/conjob/123/cmdline"

          # LATIDO_TRABAJO apunta a una ruta que existe aquí: en el contenedor es
          # /home/runner/_work, y si no existe el disco sale '-' (degrada solo).
          lat() { LATIDO_DIR="$d/latidos" LATIDO_CADA=1 LATIDO_HEALTHCHECK="$d/ok" \
                  LATIDO_MARCA_CONFIG="$d/cfg" LATIDO_TRABAJO="$d" LATIDO_PROC="$1" \
                  RUNNER_NAME=r timeout 2 sh ./latido.sh 2>/dev/null || true; }

          lat "$d/libre"
          disco="$(awk '{print $4}' "$d/latidos/r")"
          case "$disco" in ''|*[!0-9]*) echo "FALLO: el disco no es un número: '$disco'"; exit 1 ;; esac
          [ "$(awk '{print $3}' "$d/latidos/r")" = "libre" ] || { echo "FALLO: sin proceso debería ser libre"; exit 1; }
          [ "$(awk '{print $5}' "$d/latidos/r")" = "-" ] || { echo "FALLO: sin jobs debería ser '-'"; exit 1; }

          lat "$d/conjob"
          [ "$(awk '{print $3}' "$d/latidos/r")" = "ocupado" ] || { echo "FALLO: no vio el job en curso"; exit 1; }
          marca="$(awk '{print $5}' "$d/latidos/r")"
          case "$marca" in ''|*[!0-9]*) echo "FALLO: no registró la marca del job"; exit 1 ;; esac

          # Y al quedar libre NO se pierde: es lo que distingue "trabajó hace un
          # rato" de "no ha trabajado nunca".
          lat "$d/libre"
          [ "$(awk '{print $3}' "$d/latidos/r")" = "libre" ] || { echo "FALLO: debería estar libre"; exit 1; }
          [ "$(awk '{print $5}' "$d/latidos/r")" = "$marca" ] \
            || { echo "FALLO: perdió la marca del último job al quedar libre"; exit 1; }
          echo "ok: disco medido, ocupado/libre determinista y la marca sobrevive"

      # `timeout` no existe en el sistema base de macOS, y el guard de una línea
      # que lo buscaba se cumplía con elegancia: los hooks pasaban a correr SIN
      # LÍMITE. Un hook colgado en una API que no contesta atascaba entonces la
      # ronda siguiente indefinidamente y en silencio — justo lo que ese límite
      # existe para evitar. Aquí se le quitan `timeout` y `gtimeout` del PATH para
      # recorrer el camino que se toma en un Mac.
      - name: Un hook colgado no atasca la ronda aunque no haya `timeout`
        timeout-minutes: 3
        run: |
          set -eu
          d="$RUNNER_TEMP/lim"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks" "$d/bin"
          printf '%s sano libre 30 %s \n' "$(date -u +%s)" "$(date -u +%s)" > "$d/latidos/a"
          printf '#!/bin/sh\nsleep 300\n' > "$d/hooks/10-colgado"
          printf '#!/bin/sh\ncat >> %s/log\n' "$d" > "$d/hooks/20-despues"
          chmod +x "$d/hooks/10-colgado" "$d/hooks/20-despues"

          # PATH sin los dos: un enlace por herramienta del sistema MENOS esas.
          # Poner un `timeout` falso que no limitara no serviría: `command -v` lo
          # encontraría y el guard seguiría creyendo que hay límite.
          for p in /usr/bin/* /bin/*; do
            b="${p##*/}"
            case "$b" in timeout|gtimeout) continue ;; esac
            ln -sf "$p" "$d/bin/$b" 2>/dev/null || true
          done
          export PATH="$d/bin"
          command -v timeout  >/dev/null 2>&1 && { echo "FALLO: el PATH de prueba aún tiene timeout"; exit 1; }
          command -v gtimeout >/dev/null 2>&1 && { echo "FALLO: el PATH de prueba aún tiene gtimeout"; exit 1; }

          ini="$(date -u +%s)"
          env VIGIA_LATIDOS="$d/latidos" VIGIA_HOOKS="$d/hooks" VIGIA_ESTADO_FILE="$d/e" \
              VIGIA_RUNNERS=a VIGIA_CLUSTER=ci VIGIA_HOST=mac VIGIA_DESFASE_MAX=999999 \
              sh "$GITHUB_WORKSPACE/vigilar.sh" >/dev/null 2>&1
          fin="$(date -u +%s)"

          [ "$(( fin - ini ))" -lt 60 ] \
            || { echo "FALLO: la ronda tardó $(( fin - ini ))s; el hook corrió sin límite"; exit 1; }
          # Y el límite de repuesto tiene que pasarle el informe por stdin: en un
          # shell POSIX un proceso en segundo plano recibe /dev/null como entrada
          # salvo redirección explícita, así que sin ella el hook manda un aviso
          # VACÍO — arranca, no falla y no dice nada.
          grep -q 'Fleet ci' "$d/log" \
            || { echo "FALLO: el hook siguiente no recibió el informe"; cat "$d/log" 2>/dev/null; exit 1; }
          echo "ok: el hook colgado se corta y el siguiente recibe el informe entero"

      # macOS no tiene /proc: el glob `"$PROC"/[0-9]*/cmdline` se queda LITERAL y
      # la detección devolvía siempre «libre». Es el peor tipo de fallo, el
      # callado: el campo «último job» —el que delata al runner mal etiquetado al
      # que nadie manda trabajo— se quedaría en '-' para siempre con los jobs
      # corriendo.
      - name: latido.sh detecta el job con `ps` cuando no hay /proc
        run: |
          set -eu
          d="$RUNNER_TEMP/sinproc"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/con" "$d/sin"
          printf '#!/bin/sh\nexit 0\n' > "$d/ok"; chmod +x "$d/ok"; touch "$d/cfg"

          # `ps` de mentira. El de verdad no vale: este job corre DENTRO de un
          # runner de GitHub, que tiene su propio Runner.Worker, así que "no hay
          # ningún job" es irreproducible con el `ps` real.
          printf '#!/bin/sh\nprintf "launchd\\n/Users/ci/actions-runner/bin/Runner.Worker\\nsshd\\n"\n' > "$d/con/ps"
          printf '#!/bin/sh\nprintf "launchd\\nsshd\\n/usr/bin/Runner.Worker.log\\n"\n' > "$d/sin/ps"
          chmod +x "$d/con/ps" "$d/sin/ps"

          # LATIDO_PROC a una ruta que no existe: es el gancho que permite recorrer
          # la rama de macOS desde este runner de Linux.
          lat() {  # $1 = directorio con el `ps` falso
            PATH="$1:$PATH" LATIDO_DIR="$d/latidos" LATIDO_CADA=1 LATIDO_HEALTHCHECK="$d/ok" \
            LATIDO_MARCA_CONFIG="$d/cfg" LATIDO_TRABAJO="$d" LATIDO_PROC="$d/no-existe" \
            RUNNER_NAME=r timeout 2 sh ./latido.sh 2>/dev/null || true
          }

          lat "$d/con"
          [ "$(awk '{print $3}' "$d/latidos/r")" = "ocupado" ] \
            || { echo "FALLO: sin /proc no vio el job en curso"; cat "$d/latidos/r"; exit 1; }
          [ "$(awk '{print $5}' "$d/latidos/r")" != "-" ] \
            || { echo "FALLO: sin /proc no registró la marca del último job"; exit 1; }

          lat "$d/sin"
          [ "$(awk '{print $3}' "$d/latidos/r")" = "libre" ] \
            || { echo "FALLO: 'Runner.Worker.log' no es un job; solo cuenta argv[0] exacto"; exit 1; }
          echo "ok: sin /proc manda ps, con la misma regla de argv[0]"

      # `date -u -d` es de GNU y en una VM de macOS no existe. El código degradaba
      # a «sin ventana» —más sensible, nunca menos—, que suena inofensivo y no lo
      # es en una VM efímera: un error transitorio del arranque dejaría el runner
      # marcado `atascado` el resto del job, con los jobs corriendo.
      - name: healthcheck.sh acota la ventana también con el `date` de BSD
        run: |
          set -eu
          d="$RUNNER_TEMP/bsd"; rm -rf "$d"; mkdir -p "$d/_diag" "$d/bin"
          ahora="$(date -u '+%Y-%m-%d %H:%M:%S')"
          viejo="$(date -u -d '-30 minutes' '+%Y-%m-%d %H:%M:%S')"

          cat > "$d/bin/date" <<'STUB'
          #!/bin/sh
          # `date` como el de BSD/macOS: rechaza -d y entiende -v-<N>M.
          utc=""; fmt=""; resta=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -u)    utc="-u" ;;
              -d)    echo "date: illegal option -- d" >&2; exit 1 ;;
              -v-*M) resta="-${1#-v-}"; resta="${resta%M} minutes" ;;
              +*)    fmt="$1" ;;
            esac
            shift
          done
          # La resta ya traducida se delega al `date` real, que aquí es GNU.
          [ -n "$resta" ] && exec /usr/bin/date $utc -d "$resta" "$fmt"
          exec /usr/bin/date $utc "$fmt"
          STUB
          chmod +x "$d/bin/date"

          PATH="$d/bin:$PATH" date -u -d '-5 minutes' >/dev/null 2>&1 \
            && { echo "FALLO: el date de prueba acepta -d, así que no prueba nada"; exit 1; }

          hc() {  # -> código de salida de healthcheck.sh con el date de BSD
            rc=0
            PATH="$d/bin:$PATH" RUNNER_DIAG_DIR="$d/_diag" ./healthcheck.sh >/dev/null 2>&1 || rc=$?
            printf '%s' "$rc"
          }

          # Error fuera de la ventana y sin señal de recuperación: es EL caso que
          # separa las dos ramas. Sin ventana sale `atascado`; con ventana, sano.
          printf '[%sZ ERR  Listener] Retrying until reconnected.\n' "$viejo" > "$d/_diag/Runner_x.log"
          [ "$(hc)" = 0 ] \
            || { echo "FALLO: sin la forma BSD de restar minutos se perdió la ventana"; exit 1; }

          # Y la ventana sigue siendo una ventana, no un mutis: lo reciente avisa.
          printf '[%sZ ERR  Listener] Retrying until reconnected.\n' "$ahora" > "$d/_diag/Runner_x.log"
          [ "$(hc)" = 1 ] \
            || { echo "FALLO: el error reciente debería seguir dando atascado"; exit 1; }
          echo "ok: la ventana se acota igual con el date de BSD"

      # El disco lo mide cada runner DESDE DENTRO, y hay un caso en que ese no es
      # el disco que se llena: con runners en VM efímera el invitado se destruye
      # tras cada job —su ocupación nunca llega al umbral— mientras las imágenes
      # del host crecen a decenas de GB por VM. Nadie lo reportaría y la primera
      # señal sería un job fallando por «no space left».
      - name: VIGIA_DISCO_RUTA mide el disco del host y se queda con el peor
        run: |
          set -eu
          d="$RUNNER_TEMP/dr"; rm -rf "$d"; mkdir -p "$d/latidos" "$d/hooks" "$d/bin"
          now="$(date -u +%s)"

          # `df` de mentira: la ruta vigilada va al 97%.
          cat > "$d/bin/df" <<'STUB'
          #!/bin/sh
          printf 'Filesystem 1024-blocks Used Available Capacity Mounted on\n'
          printf '/dev/disco 100 97 3 97%% /\n'
          STUB
          chmod +x "$d/bin/df"

          informe() {  # $1 = ruta que mide el vigía (vacía = como hasta hoy)
            rm -f "$d/e"
            PATH="$d/bin:$PATH" env VIGIA_LATIDOS="$d/latidos" VIGIA_HOOKS="$d/hooks" \
              VIGIA_ESTADO_FILE="$d/e" VIGIA_RUNNERS=a VIGIA_CLUSTER=ci VIGIA_HOST=mac \
              VIGIA_DESFASE_MAX=999999 VIGIA_DISCO_RUTA="$1" \
              sh "$GITHUB_WORKSPACE/vigilar.sh" --informe
          }

          printf '%s sano libre 40 %s \n' "$now" "$now" > "$d/latidos/a"
          # Sin la variable no se mide nada, aunque el `df` diga 97%: el informe
          # tiene que salir idéntico al de hoy.
          informe '' | grep -q 'Disco: 40%' \
            || { echo "FALLO: sin VIGIA_DISCO_RUTA el vigía no debe medir por su cuenta"; informe ''; exit 1; }
          informe '' | grep -q 'DISCO AL' \
            && { echo "FALLO: sin la variable no puede aparecer el aviso de disco"; exit 1; }

          informe "$d" | grep -q 'Disco: 97%' \
            || { echo "FALLO: no midió la ruta que le pasaron"; informe "$d"; exit 1; }
          informe "$d" | grep -q 'DISCO AL 97%' \
            || { echo "FALLO: el disco del host no dispara el aviso"; exit 1; }

          # Y al revés: se queda el PEOR de los dos. Si un runner reporta más que
          # el host, ese es el que va a reventar y quedarse con el último medido
          # lo taparía.
          printf '%s sano libre 99 %s \n' "$now" "$now" > "$d/latidos/a"
          informe "$d" | grep -q 'Disco: 99%' \
            || { echo "FALLO: medir el host tapó lo que reportó el runner"; informe "$d"; exit 1; }
          echo "ok: VIGIA_DISCO_RUTA añade la medición del host sin tapar la del runner"

  # Los runners de macOS corren en una VM de Tart que se clona, hace UN job y se
  # destruye. Nada de eso se puede montar en un runner de Linux, así que lo que
  # se prueba aquí es el guion del invitado —entrypoint-macos.sh— con todo lo de
  # fuera stubeado: curl, tar, xattr y sudo. Sin esto, cada regresión suya se
  # descubriría con una VM que arranca, no toma ningún job y se apaga sola: desde
  # el host es indistinguible de «no había trabajo».
  macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Banco de pruebas (montajes falsos y stubs en el PATH)
        run: |
          set -eu
          d="$RUNNER_TEMP/mac"; rm -rf "$d"; mkdir -p "$d"

          # Un banco de pruebas por caso: montaje de solo lectura (como el que pasa
          # `tart run --dir=`), montaje de latidos, HOME de la VM y stubs en el PATH.
          # Todo lo que el script invoca fuera de bash es de mentira: este job corre en
          # Linux y no hay ni VM, ni Gatekeeper, ni GitHub.
          cat > "$d/banco.sh" <<'BANCO'
          # preparar <dir> — deja el banco listo y exporta B/REG.
          preparar() {
            B="$1"; REG="$B/reg"; export B REG
            rm -rf "$B"; mkdir -p "$B/montaje" "$B/latidos" "$B/home" "$B/bin" "$REG"
            cp "$GITHUB_WORKSPACE/mint.sh" "$GITHUB_WORKSPACE/latido.sh" \
               "$GITHUB_WORKSPACE/healthcheck.sh" "$B/montaje/"
            chmod +x "$B/montaje/latido.sh" "$B/montaje/healthcheck.sh"
            printf 'PAT-DE-PRUEBA\n' > "$B/montaje/access_token"
            # El tarball puede estar vacío: lo desempaqueta el `tar` de mentira.
            : > "$B/montaje/actions-runner-osx-arm64-9.9.9.tar.gz"

            # curl falso: responde 201 con un token y anota a qué URL se llamó, que es
            # como se comprueba si hubo registration-token y/o remove-token.
            cat > "$B/bin/curl" <<'STUB'
          #!/bin/sh
          hdr=""; out=""; url=""; prev=""
          for a in "$@"; do
            case "$prev" in -D) hdr="$a" ;; -o) out="$a" ;; esac
            case "$a" in https://*) url="$a" ;; esac
            prev="$a"
          done
          echo "$url" >> "$REG/red.log"
          [ -n "$hdr" ] && : > "$hdr"
          [ -n "$out" ] && printf '{"token":"TOKEN-DE-REGISTRO"}' > "$out"
          printf '201'
          STUB

            # tar falso: en vez de desempaquetar, planta el config.sh y el run.sh de
            # mentira en el destino de -C, que es lo que el script va a ejecutar.
            cat > "$B/bin/tar" <<'STUB'
          #!/bin/sh
          dest="."; prev=""
          for a in "$@"; do [ "$prev" = "-C" ] && dest="$a"; prev="$a"; done
          echo "tar $*" >> "$REG/llamadas.log"
          mkdir -p "$dest"
          cat > "$dest/config.sh" <<'EOS'
          #!/bin/sh
          echo "config.sh $*" >> "$REG/llamadas.log"
          [ "$1" = "remove" ] && exit 0
          : > .runner
          exit 0
          EOS
          cat > "$dest/run.sh" <<'EOS'
          #!/bin/sh
          echo "run.sh trap_sig=${RUNNER_MANUALLY_TRAP_SIG:-no}" >> "$REG/llamadas.log"
          if [ "${RUN_MODO:-rapido}" = "lento" ]; then
            trap 'echo "run.sh recibio la senal" >> "$REG/llamadas.log"; exit 0' TERM
            sleep 30 & wait $!
          fi
          exit 0
          EOS
          chmod +x "$dest/config.sh" "$dest/run.sh"
          STUB

            # xattr y sudo falsos. El de xattr anota TAMBIÉN el directorio de trabajo:
            # el script llama `xattr -dr … .`, y lo que importa es sobre qué directorio.
            printf '#!/bin/sh\necho "xattr(%s) $*" >> "$REG/llamadas.log"\n' '$PWD' > "$B/bin/xattr"
            printf '#!/bin/sh\necho "sudo $*" >> "$REG/llamadas.log"\nexit 0\n' > "$B/bin/sudo"
            chmod +x "$B/bin"/*
          }

          # arrancar — lanza el entrypoint con el banco puesto. Argumentos extra = env.
          entorno() {
            printf '%s\n' "PATH=$B/bin:$PATH" "HOME=$B/home" "REG=$REG" \
              "GH_RUNNER_MONTAJE=$B/montaje" "GH_RUNNER_LATIDOS=$B/latidos" \
              REPO_USER=sherman REPO_NAME=app RUNNER_NAME=mac-1 \
              RUNNER_LABELS=self-hosted,macOS,sherman
          }
          BANCO

      # El ciclo completo de una VM: mintear el token, desempaquetar el agente en
      # $HOME, registrarse EFÍMERO y apagar. El apagado es el que más silencio
      # tiene si se pierde: `tart run` no retorna, el supervisor no hace `tart
      # delete` ni clona el relevo, y el fleet se para sin que falle nada.
      - name: Ciclo sano de una VM efímera
        run: |
          set -eu
          d="$RUNNER_TEMP/mac"
          . "$d/banco.sh"
          preparar "$d/sano"

          # shellcheck disable=SC2046
          env $(entorno) timeout 60 bash "$GITHUB_WORKSPACE/entrypoint-macos.sh" \
            > "$B/salida.log" 2>&1 || { echo "FALLO: el ciclo sano salió con error"; cat "$B/salida.log"; exit 1; }
          # El latido corre en segundo plano y sobrevive al entrypoint: se le da un
          # momento para publicar su primera línea antes de recogerlo.
          i=0; while [ "$i" -lt 25 ] && [ ! -f "$B/latidos/mac-1" ]; do sleep 0.2; i=$((i+1)); done
          pkill -f "$B/montaje/latido.sh" 2>/dev/null || true

          cfg="$(grep '^config\.sh ' "$REG/llamadas.log" | head -n1)"
          for flag in --unattended --replace --ephemeral --disableupdate; do
            case "$cfg" in *"$flag"*) : ;; *) echo "FALLO: config.sh sin $flag: $cfg"; exit 1 ;; esac
          done
          case "$cfg" in *"--name mac-1"*) : ;; *) echo "FALLO: nombre del runner: $cfg"; exit 1 ;; esac
          case "$cfg" in *"--labels self-hosted,macOS,sherman"*) : ;; *) echo "FALLO: labels: $cfg"; exit 1 ;; esac
          case "$cfg" in *"--work _work"*) : ;; *) echo "FALLO: --work: $cfg"; exit 1 ;; esac
          grep -q 'registration-token' "$REG/red.log" || { echo "FALLO: no minteó token de registro"; exit 1; }
          grep -q '^sudo shutdown -h now' "$REG/llamadas.log" \
            || { echo "FALLO: la VM no se apagó; 'tart run' no retorna y el supervisor no lanza el relevo"; cat "$REG/llamadas.log"; exit 1; }
          [ -f "$B/latidos/mac-1" ] || { echo "FALLO: latido.sh no publicó nada en el montaje de latidos"; exit 1; }
          [ -f "$B/home/actions-runner/config.sh" ] || { echo "FALLO: el agente no se desempaquetó en \$HOME"; exit 1; }
          echo "ok: ciclo sano completo (token, config efímera, latido y apagado)"

      # Lo que llega de un tarball y de un montaje virtiofs arrastra
      # com.apple.quarantine, y con él Gatekeeper mata Runner.Listener sin dejar
      # una traza que señale la causa. Que el `xattr` exista no basta: si va
      # DESPUÉS de config.sh, para entonces el agente ya ejecutó sus binarios.
      - name: La cuarentena se quita antes de config.sh
        run: |
          set -eu
          d="$RUNNER_TEMP/mac"
          . "$d/banco.sh"
          preparar "$d/gatekeeper"

          # shellcheck disable=SC2046
          env $(entorno) timeout 60 bash "$GITHUB_WORKSPACE/entrypoint-macos.sh" >/dev/null 2>&1 || true
          pkill -f "$B/montaje/latido.sh" 2>/dev/null || true

          n_x="$(grep -n 'xattr(.*) -dr com\.apple\.quarantine' "$REG/llamadas.log" | head -n1 | cut -d: -f1 || true)"
          n_c="$(grep -n '^config\.sh ' "$REG/llamadas.log" | head -n1 | cut -d: -f1 || true)"
          [ -n "$n_x" ] || { echo "FALLO: nunca se quitó com.apple.quarantine; Gatekeeper mata Runner.Listener sin traza útil"; cat "$REG/llamadas.log"; exit 1; }
          [ -n "$n_c" ] || { echo "FALLO: no se llegó a config.sh"; exit 1; }
          [ "$n_x" -lt "$n_c" ] \
            || { echo "FALLO: el xattr va DESPUÉS de config.sh; para entonces el agente ya arrancó binarios en cuarentena"; cat "$REG/llamadas.log"; exit 1; }
          grep -q "xattr($B/home/actions-runner)" "$REG/llamadas.log" \
            || { echo "FALLO: el xattr no se aplicó sobre el directorio del runner"; cat "$REG/llamadas.log"; exit 1; }
          echo "ok: la cuarentena se quita sobre el runner y antes de config.sh"

      # Parada elegante mientras el runner está idle. Sin el reenvío de la señal
      # con RUNNER_MANUALLY_TRAP_SIG=1, run.sh no drena y el runner muere sin
      # desregistrarse: queda un fantasma en Settings -> Runners que ningún ciclo
      # posterior limpia (la VM siguiente estrena nombre).
      - name: SIGTERM drena run.sh y desregistra el runner idle
        run: |
          set -eu
          d="$RUNNER_TEMP/mac"
          . "$d/banco.sh"
          preparar "$d/senal"

          # RUN_MODO=lento: run.sh se queda esperando, como un runner idle a la espera de
          # un job. Es el único estado en el que hay que desregistrar a mano.
          # shellcheck disable=SC2046
          env $(entorno) RUN_MODO=lento bash "$GITHUB_WORKSPACE/entrypoint-macos.sh" >"$B/salida.log" 2>&1 &
          pid=$!

          i=0
          while [ "$i" -lt 100 ] && ! grep -q '^run\.sh ' "$REG/llamadas.log" 2>/dev/null; do sleep 0.1; i=$((i+1)); done
          grep -q '^run\.sh ' "$REG/llamadas.log" || { echo "FALLO: run.sh no llegó a arrancar"; cat "$B/salida.log"; exit 1; }

          kill -TERM "$pid"
          rc=0; wait "$pid" || rc=$?
          pkill -f "$B/montaje/latido.sh" 2>/dev/null || true

          grep -q 'run\.sh trap_sig=1' "$REG/llamadas.log" \
            || { echo "FALLO: sin RUNNER_MANUALLY_TRAP_SIG=1 run.sh no reenvía la señal a Runner.Listener y el runner muere sin desregistrarse"; exit 1; }
          grep -q 'run\.sh recibio la senal' "$REG/llamadas.log" \
            || { echo "FALLO: la señal no se reenvió a run.sh: se quedaría el job a medias y sin drenar"; cat "$REG/llamadas.log"; exit 1; }
          grep -q 'remove-token' "$REG/red.log" \
            || { echo "FALLO: no se pidió remove-token: el runner idle queda de fantasma en GitHub"; cat "$REG/red.log"; exit 1; }
          grep -q '^config\.sh remove ' "$REG/llamadas.log" \
            || { echo "FALLO: no se ejecutó 'config.sh remove'"; cat "$REG/llamadas.log"; exit 1; }
          grep -q '^sudo shutdown -h now' "$REG/llamadas.log" \
            || { echo "FALLO: tras la parada la VM no se apagó"; exit 1; }
          [ "$rc" -eq 0 ] || { echo "FALLO: la parada elegante no salió con 0 (rc=$rc)"; exit 1; }
          echo "ok: SIGTERM se reenvía a run.sh, el runner se desregistra y la VM se apaga"

      # macOS trae bash 3.2 y ahí no hay bash 4. Este candado es barato y evita
      # el peor camino: el script no arranca, la VM se apaga sola y el supervisor
      # lo lee como un ciclo más sin trabajo.
      - name: Compatible con el bash 3.2 de macOS
        run: |
          set -eu
          # Los comentarios se vacían (conservando el número de línea): la cabecera del
          # script NOMBRA a propósito lo que está prohibido, y sin esto se delataría a sí
          # misma. Lo que se audita es el código.
          codigo="$RUNNER_TEMP/mac-codigo.sh"
          sed 's/^[[:space:]]*#.*$//' "$GITHUB_WORKSPACE/entrypoint-macos.sh" > "$codigo"

          malo=0
          # Arrays asociativos: bash 4. En el bash 3.2 de macOS `declare -A x` no declara
          # nada y `x[clave]=v` acaba escribiendo en el índice 0 del array indexado: no
          # falla, guarda mal, y el síntoma aparece mucho después.
          if grep -nE '(declare|local|typeset)[[:space:]]+-[A-Za-z]*A' "$codigo"; then
            echo "FALLO: array asociativo (bash 4); macOS trae bash 3.2"; malo=1
          fi
          # Cambio de caja ${x,,} / ${x^^}: bash 4. En 3.2 es error de SINTAXIS, así que
          # el script ni arranca y la VM se apaga sin haber tomado un solo job.
          if grep -nE '\$\{[A-Za-z_][A-Za-z0-9_]*(\[[^]]*\])?(,,|\^\^|,|\^)[^}]*\}' "$codigo"; then
            echo "FALLO: cambio de caja \${x,,}/\${x^^} (bash 4); macOS trae bash 3.2"; malo=1
          fi
          # mapfile/readarray: también bash 4, y su ausencia es silenciosa (con `|| true`
          # alrededor deja el array vacío y el script sigue como si nada).
          if grep -nE '\b(mapfile|readarray)\b' "$codigo"; then
            echo "FALLO: mapfile/readarray (bash 4); macOS trae bash 3.2"; malo=1
          fi
          # Y las dos herencias de Linux que aquí no existen: en la VM el usuario es
          # `admin` (su casa es /Users/admin) y el paquete osx-arm64 no trae
          # installdependencies.sh, así que llamarlo aborta el arranque.
          if grep -n '/home/runner\|installdependencies' "$codigo"; then
            echo "FALLO: ruta o script de Linux en el entrypoint de macOS"; malo=1
          fi
          [ "$malo" -eq 0 ] || exit 1
          echo "ok: nada de bash 4 ni rutas de Linux"

  # El supervisor es lo que en macOS sustituye a `restart: always`, y sus
  # fallos son todos silenciosos: una VM que se queda no da error (da 60 GB
  # menos de disco y un slot que ya no arranca), y un runner fantasma en
  # GitHub no da error (da un "caído" perpetuo en el panel del vigía). Por eso
  # todo lo que se afirma aquí es sobre el ARGV de lo que se invoca.
  supervisor-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Banco de pruebas (stubs de tart, ssh y curl en el PATH)
        run: |
          set -eu
          d="$RUNNER_TEMP/sup"; rm -rf "$d"; mkdir -p "$d"

          # Todo lo que el supervisor invoca fuera del shell es de mentira: este job
          # corre en Linux y no hay ni Tart, ni VM, ni GitHub. Lo que se comprueba es
          # el ORDEN y el CONTENIDO de lo que se les manda, que es donde viven los
          # fallos caros (una VM que se queda, un fantasma que nadie limpia).
          cat > "$d/banco.sh" <<'BANCO'
          # preparar <dir> — deja el banco listo y exporta B/REG.
          preparar() {
            B="$1"; REG="$B/reg"; export B REG
            rm -rf "$B"; mkdir -p "$B/montaje" "$B/latidos" "$B/estado" "$B/home" "$B/bin" "$REG"
            cp "$GITHUB_WORKSPACE/mint.sh" "$GITHUB_WORKSPACE/latido.sh" "$B/montaje/"
            printf 'PAT-SECRETO-abc123\n' > "$B/montaje/access_token"
            : > "$B/conf.env"
            : > "$REG/tart.log"; : > "$REG/ssh.log"; : > "$REG/curl.log"

            # tart falso: registra su argv COMPLETO. Es lo que permite afirmar el orden
            # del ciclo y, de paso, que el PAT no viaja en ninguna línea de comandos.
            cat > "$B/bin/tart" <<'STUB'
          #!/bin/sh
          echo "tart $*" >> "$REG/tart.log"
          case "$1" in
            list)
              echo "Source Name Disk Size State"
              [ -n "${TART_CENSO:-}" ] && printf '%s\n' "$TART_CENSO"
              exit 0 ;;
            # TEST-NET-1 (RFC 5737): jamás enrutable, así que un ssh que se escapara
            # del stub no puede acabar hablando con una máquina de verdad.
            ip) echo "192.0.2.10"; exit 0 ;;
            run)
              # Modela al invitado: se queda encendido hasta que le piden drenar (el
              # `pkill` por ssh), que es cuando `tart run` retorna de verdad.
              if [ -n "${TART_RUN_ESPERA:-}" ]; then
                i=0
                while [ "$i" -lt 200 ]; do
                  [ -f "$REG/ssh-pkill" ] && break
                  sleep 0.1; i=$((i+1))
                done
              fi
              ;;
          esac
          [ "${TART_RC_CMD:-}" = "$1" ] && exit "${TART_RC:-0}"
          exit 0
          STUB

            # ssh falso: registra el argv y deja la marca que hace retornar al `tart run`.
            cat > "$B/bin/ssh" <<'STUB'
          #!/bin/sh
          echo "ssh $*" >> "$REG/ssh.log"
          case "$*" in *pkill*) : > "$REG/ssh-pkill" ;; esac
          exit 0
          STUB

            # curl falso: solo lo que usa desregistrar_por_api. Devuelve el fantasma con
            # el nombre que espera el caso y anota el método de cada llamada.
            cat > "$B/bin/curl" <<'STUB'
          #!/bin/sh
          url=""; metodo="GET"; prev=""
          for a in "$@"; do
            case "$prev" in -X) metodo="$a" ;; esac
            case "$a" in https://*) url="$a" ;; esac
            prev="$a"
          done
          echo "$metodo $url" >> "$REG/curl.log"
          [ "$metodo" = "GET" ] && printf '{"runners":[{"id":77,"name":"%s"}]}' "${VM_ESPERADA:-x}"
          exit 0
          STUB
            chmod +x "$B/bin"/*
          }

          # sleep falso: el backoff llega a 300 s y ninguna prueba puede tardar eso.
          # Registra lo que se le pidió y vuelve al instante.
          stub_sleep() {
            cat > "$B/bin/sleep" <<'STUB'
          #!/bin/sh
          echo "sleep $1" >> "$REG/sleep.log"
          exit 0
          STUB
            chmod +x "$B/bin/sleep"
          }

          # supervisar [args…] — lanza el supervisor con el banco puesto.
          supervisar() {
            env PATH="$B/bin:$PATH" HOME="$B/home" REG="$REG" \
                REPO_USER=sherman REPO_NAME=app ACCESS_TOKEN=PAT-SECRETO-abc123 \
                VM_ESPERADA=prueba-mac-1 SUPERVISAR_HOST=mac \
                TART_CENSO="${TART_CENSO:-}" TART_RC="${TART_RC:-}" TART_RC_CMD="${TART_RC_CMD:-}" \
                TART_RUN_ESPERA="${TART_RUN_ESPERA:-}" SUPERVISAR_GRACIA="${SUPERVISAR_GRACIA:-90}" \
                sh "$GITHUB_WORKSPACE/supervisar-macos.sh" \
                  --slot 1 --cluster prueba --conf "$B/conf.env" \
                  --montaje "$B/montaje" --latidos "$B/latidos" --estado "$B/estado" \
                  --golden dorada "$@"
          }

          # Los verbos de tart, en orden y uno por línea.
          verbos() { awk '{ print $2 }' "$REG/tart.log"; }
          BANCO

      # El orden del ciclo NO es cosmético: `set` después de `run` no vira nada (la VM
      # ya arrancó con los recursos de la golden) y `delete` antes de que `run` retorne
      # borra una VM encendida. Los dos fallos son silenciosos: el job corre igual, solo
      # que con la máquina equivocada o con la siguiente vuelta rota.
      - name: El ciclo va clone -> set -> run -> stop -> delete
        run: |
          set -eu
          . "$RUNNER_TEMP/sup/banco.sh"
          preparar "$RUNNER_TEMP/sup/orden"

          supervisar --ciclos 1 --limite-job 0 --cpu 4 --memoria 8192 > "$B/salida.log" 2>&1 \
            || { echo "FALLO: la vuelta salió con error"; cat "$B/salida.log"; exit 1; }

          orden="$(verbos | grep -v '^list$' | tr '\n' ' ')"
          case "$orden" in
            "clone set run stop delete "*) : ;;
            *) echo "FALLO: el ciclo no es clone->set->run->stop->delete sino: $orden"; cat "$REG/tart.log"; exit 1 ;;
          esac
          grep -q '^tart clone dorada prueba-mac-1$' "$REG/tart.log" \
            || { echo "FALLO: se clonó otra cosa (la VM se llama <cluster>-<host>-<slot>)"; cat "$REG/tart.log"; exit 1; }
          grep -q '^tart set prueba-mac-1 --cpu 4 --memory 8192$' "$REG/tart.log" \
            || { echo "FALLO: 'tart set' no aplicó cpu y memoria en una sola llamada"; cat "$REG/tart.log"; exit 1; }
          grep -q -- '--dir=gh-runner:.*:ro' "$REG/tart.log" \
            || { echo "FALLO: el montaje gh-runner no va en solo lectura; un job podría reescribir el entrypoint de la vuelta siguiente"; exit 1; }
          grep -q -- '--dir=latidos:' "$REG/tart.log" \
            || { echo "FALLO: sin el montaje de latidos el invitado no puede publicar su estado"; exit 1; }
          echo "ok: clone -> set -> run -> stop -> delete, con los dos montajes"

      # El fallo caro de todos: si `tart run` sale mal y el `delete` va colgado del
      # camino feliz, la VM se queda. Son decenas de GB de un disco de menos de 500 y,
      # a la vuelta siguiente, `tart clone` falla por nombre duplicado y el slot no
      # vuelve a arrancar nunca.
      - name: Una VM no se fuga aunque 'tart run' falle
        run: |
          set -eu
          . "$RUNNER_TEMP/sup/banco.sh"
          preparar "$RUNNER_TEMP/sup/fuga"

          TART_RC=1 TART_RC_CMD=run supervisar --ciclos 1 --limite-job 0 > "$B/salida.log" 2>&1 \
            || { echo "FALLO: un 'tart run' fallido no debe tumbar al supervisor"; cat "$B/salida.log"; exit 1; }

          grep -q '^tart delete prueba-mac-1$' "$REG/tart.log" \
            || { echo "FALLO: 'tart run' falló y la VM se quedó sin borrar"; cat "$REG/tart.log"; exit 1; }
          grep -q 'DELETE .*/actions/runners/77' "$REG/curl.log" \
            || { echo "FALLO: tras una vuelta fallida no se limpió el runner fantasma"; cat "$REG/curl.log"; exit 1; }
          echo "ok: la VM se borra y el fantasma se limpia aunque la vuelta falle"

      # Y tampoco se fuga si el que falla es `tart stop`, que es EL caso: una VM
      # colgada es justo la que no para con gracia, y es la que hay que borrar sí
      # o sí. El test de arriba solo tumbaba `run`, así que con `stop` devolviendo
      # 0 en el banco, encadenar el borrado al éxito del stop
      # (`tart stop ... && tart delete ...`) pasaba en verde y dejaba 60 GB
      # colgados en cada VM que no parase. Por eso este caso va aparte.
      - name: Una VM tampoco se fuga si 'tart stop' falla
        run: |
          set -eu
          . "$RUNNER_TEMP/sup/banco.sh"
          preparar "$RUNNER_TEMP/sup/fuga-stop"

          TART_RC=1 TART_RC_CMD=stop supervisar --ciclos 1 --limite-job 0 > "$B/salida.log" 2>&1 \
            || { echo "FALLO: un 'tart stop' fallido no debe tumbar al supervisor"; cat "$B/salida.log"; exit 1; }

          grep -q '^tart delete prueba-mac-1$' "$REG/tart.log" \
            || { echo "FALLO: 'tart stop' falló y la VM se quedó sin borrar"; cat "$REG/tart.log"; exit 1; }
          echo "ok: la VM se borra aunque 'tart stop' falle"

      # Lo que la parada elegante NO puede cubrir: un `kill -9`, un pánico o un corte
      # de luz dejan la VM del slot viva en `tart list` y a nadie que la borre — el
      # supervisor que la creó ya no existe. Por eso el barrido va AL ARRANCAR, y antes
      # del primer clone: si fuera después, el `tart clone` chocaría con el nombre.
      - name: Las VM huérfanas se recogen al arrancar
        run: |
          set -eu
          . "$RUNNER_TEMP/sup/banco.sh"
          preparar "$RUNNER_TEMP/sup/huerfana"

          TART_CENSO="local prueba-mac-7 60 20 stopped" \
            supervisar --ciclos 1 --limite-job 0 > "$B/salida.log" 2>&1 || true

          n_h="$(grep -n '^tart delete prueba-mac-7$' "$REG/tart.log" | head -n1 | cut -d: -f1 || true)"
          n_c="$(grep -n '^tart clone ' "$REG/tart.log" | head -n1 | cut -d: -f1 || true)"
          [ -n "$n_h" ] \
            || { echo "FALLO: la VM huérfana del slot 7 sigue ahí; son decenas de GB y un slot bloqueado"; cat "$REG/tart.log"; exit 1; }
          [ -n "$n_c" ] || { echo "FALLO: no se llegó a clonar"; cat "$REG/tart.log"; exit 1; }
          [ "$n_h" -lt "$n_c" ] \
            || { echo "FALLO: el barrido va DESPUÉS del clone; para entonces el nombre ya chocó"; cat "$REG/tart.log"; exit 1; }
          echo "ok: la huérfana se recoge antes del primer clone"

      # La parada tiene que caber en el ExitTimeOut del plist (120 s) y, sobre todo,
      # tiene que pedirle al INVITADO que drene: matar el `tart run` de golpe deja el
      # job a medias y el runner sin desregistrar. Y el paso que no existe en el camino
      # de Linux es el último: si la VM murió colgada, el invitado nunca se desregistró
      # y ese runner `offline` contaría como caído para siempre.
      - name: SIGTERM drena por ssh, derriba la VM y limpia el runner en GitHub
        run: |
          set -eu
          . "$RUNNER_TEMP/sup/banco.sh"
          preparar "$RUNNER_TEMP/sup/parada"

          export TART_RUN_ESPERA=1 SUPERVISAR_GRACIA=10
          supervisar --limite-job 0 > "$B/salida.log" 2>&1 &
          espera=$!

          i=0
          while [ "$i" -lt 200 ] && ! grep -q '^tart run ' "$REG/tart.log" 2>/dev/null; do sleep 0.1; i=$((i+1)); done
          grep -q '^tart run ' "$REG/tart.log" || { echo "FALLO: la VM no llegó a arrancar"; cat "$B/salida.log"; exit 1; }

          # El PID sale del fichero que el propio supervisor publica: es el mismo que
          # usa el barrido de huérfanas para saber si un slot tiene dueño vivo.
          sup="$(cat "$B/estado/runner-1/supervisor.pid")"
          kill -TERM "$sup"
          rc=0; wait "$espera" || rc=$?

          grep -q 'pkill -TERM -f entrypoint-macos.sh' "$REG/ssh.log" \
            || { echo "FALLO: no se le pidió al invitado que drenara; el job muere a medias"; cat "$REG/ssh.log"; exit 1; }
          n_s="$(grep -n '^tart stop prueba-mac-1$'   "$REG/tart.log" | head -n1 | cut -d: -f1 || true)"
          n_d="$(grep -n '^tart delete prueba-mac-1$' "$REG/tart.log" | head -n1 | cut -d: -f1 || true)"
          { [ -n "$n_s" ] && [ -n "$n_d" ] && [ "$n_s" -lt "$n_d" ]; } \
            || { echo "FALLO: la parada no hizo stop y luego delete"; cat "$REG/tart.log"; exit 1; }
          grep -q 'DELETE .*/actions/runners/77' "$REG/curl.log" \
            || { echo "FALLO: no se borró el runner por API; quedaría un fantasma offline que el vigía cuenta como caído para siempre"; cat "$REG/curl.log"; exit 1; }
          [ ! -f "$B/estado/runner-1/supervisor.pid" ] \
            || { echo "FALLO: quedó el pidfile; el barrido de la próxima vez creería que el slot tiene dueño"; exit 1; }
          [ "$rc" -eq 0 ] || { echo "FALLO: la parada no salió con 0 (rc=$rc); launchd lo leería como caída"; exit 1; }
          echo "ok: ssh -> stop -> delete -> DELETE del runner, y salida limpia"

      # El PAT es el secreto del despliegue y una línea de comandos la ve cualquiera
      # con `ps` en la máquina — incluido un job de un PR de terceros. Va por cabecera
      # de curl y por el montaje, nunca en el argv de tart ni de ssh. Se auditan los
      # registros de la parada elegante, que es la vuelta que MÁS herramientas invoca.
      - name: El PAT no aparece en ningún argv de tart ni de ssh
        run: |
          set -eu
          REG="$RUNNER_TEMP/sup/parada/reg"
          [ -s "$REG/tart.log" ] || { echo "FALLO: no hay registro de tart que auditar"; exit 1; }
          [ -s "$REG/ssh.log" ]  || { echo "FALLO: no hay registro de ssh que auditar"; exit 1; }
          if grep -q 'PAT-SECRETO-abc123' "$REG/tart.log" "$REG/ssh.log"; then
            echo "FALLO: el PAT viaja en una línea de comandos; cualquier 'ps' en la máquina lo lee"
            grep -n 'PAT-SECRETO-abc123' "$REG/tart.log" "$REG/ssh.log" || true
            exit 1
          fi
          echo "ok: el PAT no está en el argv de tart ni de ssh"

      # El backoff es lo que protege el rate limit del PAT: cada vuelta mintea un
      # registration-token, así que un crash-loop sin freno agota la cuota y el fleet
      # ENTERO deja de poder registrar runners. Aquí se fijan sus dos mitades: que la
      # espera crece, y dónde está el umbral de "vuelta sana".
      - name: El backoff crece, y una vuelta corta cuenta como fallo
        run: |
          set -eu
          . "$RUNNER_TEMP/sup/banco.sh"

          # (a) Dos fallos seguidos esperan más que uno. Sin crecimiento, un slot roto
          # martillea la API cada 15 s indefinidamente.
          preparar "$RUNNER_TEMP/sup/backoff"; stub_sleep
          supervisar --ciclos 3 --limite-job 0 > "$B/salida.log" 2>&1 || true
          esperas="$(sed -n 's/.*esperando \([0-9]\{1,\}\)s.*/\1/p' "$B/salida.log")"
          n="$(printf '%s\n' "$esperas" | grep -c '[0-9]' || true)"
          [ "$n" -ge 2 ] \
            || { echo "FALLO: dos vueltas fallidas seguidas no aplicaron backoff dos veces"; cat "$B/salida.log"; exit 1; }
          e1="$(printf '%s\n' "$esperas" | sed -n 1p)"
          e2="$(printf '%s\n' "$esperas" | sed -n 2p)"
          [ "$e2" -gt "$e1" ] \
            || { echo "FALLO: la segunda espera (${e2}s) no es mayor que la primera (${e1}s)"; cat "$B/salida.log"; exit 1; }

          # (b) Una vuelta de 25 s es un FALLO, no un job corto: en macOS una vuelta
          # sana incluye arrancar la VM (~30-45 s), así que con el umbral de 20 s que
          # usa Linux un crash-loop de VM que no arranca pasaría por trabajo normal y
          # no frenaría nunca.
          preparar "$RUNNER_TEMP/sup/corto"; stub_sleep
          mkdir -p "$B/estado/runner-1"
          expr "$(date +%s)" - 25 > "$B/estado/runner-1/.gh_runner_last"
          supervisar --ciclos 1 --limite-job 0 > "$B/salida.log" 2>&1 || true
          grep -q 'Fallo rápido (#1, vuelta previa 25s' "$B/salida.log" \
            || { echo "FALLO: una vuelta de 25s no se contó como fallo; el umbral sano en macOS son 90s, no los 20 de Linux"; cat "$B/salida.log"; exit 1; }
          echo "ok: el backoff crece y el umbral sano son 90s"

      # Entre vuelta y vuelta hay 60-90 s sin VM (clone y boot por delante, stop y
      # delete por detrás) y VIGIA_RANCIO son 120 s. Si nadie escribe el latido en ese
      # hueco, el vigía da por CAÍDO a un slot sano en cada rotación y el aviso se
      # vuelve ruido que se acaba ignorando.
      - name: El supervisor late 'arrancando' mientras no hay VM
        run: |
          set -eu
          . "$RUNNER_TEMP/sup/banco.sh"
          preparar "$RUNNER_TEMP/sup/latido"

          supervisar --ciclos 1 --limite-job 0 > "$B/salida.log" 2>&1 || true

          # El nombre del fichero es el mismo nombre único: VM, runner y latido.
          lat="$B/latidos/prueba-mac-1"
          [ -f "$lat" ] \
            || { echo "FALLO: nadie escribió el latido en el hueco sin VM; el vigía daría el slot por caído en cada rotación"; ls -la "$B/latidos"; exit 1; }
          estado="$(awk '{ print $2 }' "$lat")"
          [ "$estado" = "arrancando" ] \
            || { echo "FALLO: el latido dice '$estado' y no 'arrancando'"; cat "$lat"; exit 1; }
          # Mismo formato que latido.sh: epoch, estado, ocupado/libre, disco, último job, motivo.
          campos="$(awk '{ print NF }' "$lat")"
          [ "$campos" -ge 5 ] || { echo "FALLO: la línea de latido no sigue el formato de latido.sh"; cat "$lat"; exit 1; }
          echo "ok: el hueco sin VM queda cubierto por el latido del supervisor"

  # deploy-macos.sh genera lo que launchd lee, y launchd no perdona: un plist mal
  # formado no da "XML inválido", da "Bootstrap failed: 5: Input/output error" y el
  # fleet no arranca. Lo mismo con ExitTimeOut: si es corto, launchd manda SIGKILL a
  # mitad de la parada elegante y deja justo lo que `recoger_huerfanas` tiene que
  # barrer (una VM de decenas de GB viva y un runner fantasma en Settings). Nada de
  # eso se ve leyendo el script, así que se comprueba parseando el plist con
  # plistlib — el análogo exacto de validar el compose con PyYAML en el job `smoke`.
  deploy-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stubs de tart, launchctl, sw_vers, brew y podman en el PATH
        run: |
          set -eu
          d="$RUNNER_TEMP/bin"; mkdir -p "$d"

          # Aquí no hay ni Tart ni launchd: este job comprueba lo que se ESCRIBE,
          # no lo que pasa al levantarlo. Los stubs solo evitan que el script se
          # desvíe por "no encuentro el binario".
          cat > "$d/tart" <<'STUB'
          #!/bin/sh
          [ "$1" = list ] && { echo "Source Name Disk Size State"; exit 0; }
          exit 0
          STUB
          cat > "$d/launchctl" <<'STUB'
          #!/bin/sh
          exit 0
          STUB
          cat > "$d/sw_vers" <<'STUB'
          #!/bin/sh
          [ "$1" = "-productVersion" ] && { echo "15.4"; exit 0; }
          echo "macOS"; exit 0
          STUB
          cat > "$d/brew" <<'STUB'
          #!/bin/sh
          exit 0
          STUB
          # deploy.sh (camino Linux) hace falta en el caso de paridad de nombres.
          cat > "$d/podman" <<'STUB'
          #!/bin/sh
          if [ "$1" = "compose" ] && [ "$2" = "version" ]; then echo "stub"; exit 0; fi
          exit 0
          STUB
          chmod +x "$d"/*
          echo "$d" >> "$GITHUB_PATH"

      - name: Los plists dicen lo que launchd necesita (y los parsea plistlib)
        run: |
          set -eu
          d="$RUNNER_TEMP/mac-plist/mi-cluster"; rm -rf "$d"; mkdir -p "$d"; cd "$d"
          sh "$GITHUB_WORKSPACE/deploy-macos.sh" --no-up --skip-validation \
            --token PAT-SECRETO-abc123 --repo owner/repo --count 2 \
            --cpus 4 --memory 12G --vigilar >/dev/null 2>&1

          # El de control se GENERA, así que un error de sintaxis suyo no aparecería
          # hasta que alguien intentara parar el fleet.
          sh -n macos-ctl.sh || { echo "FALLO: macos-ctl.sh generado no es sh válido"; exit 1; }

          python3 - <<'PY'
          import glob, os, plistlib, sys

          dep = os.getcwd()
          fallos = []
          etiquetas = set()

          for f in sorted(glob.glob("LaunchAgents/*.plist")):
              with open(f, "rb") as fh:
                  p = plistlib.load(fh)          # si no es XML válido, revienta aquí

              lab = p.get("Label", "")
              if lab in etiquetas:
                  fallos.append(f"{f}: Label repetida ({lab}); launchd solo cargaría uno de los dos")
              etiquetas.add(lab)
              if "mi-cluster" not in lab:
                  fallos.append(f"{f}: la Label no lleva el cluster ({lab}); dos despliegues del mismo Mac chocarían")

              # KeepAlive es el `restart: always`; sin RunAtLoad no arranca al cargar.
              for k in ("KeepAlive", "RunAtLoad"):
                  if p.get(k) is not True:
                      fallos.append(f"{f}: {k} no es true ({p.get(k)!r})")

              # 120 s es lo que tarda la parada elegante del supervisor: pedir el
              # drenado por ssh (90 s de gracia), tart stop, tart delete y borrar el
              # runner fantasma por API. Con menos, SIGKILL a mitad.
              if int(p.get("ExitTimeOut", 0)) < 120:
                  fallos.append(f"{f}: ExitTimeOut={p.get('ExitTimeOut')} < 120; launchd mataría la parada elegante")

              for k in ("StandardOutPath", "StandardErrorPath"):
                  ruta = p.get(k, "")
                  if not ruta.startswith(dep + "/log/"):
                      fallos.append(f"{f}: {k}={ruta} fuera de {dep}/log")

              args = p.get("ProgramArguments", [])
              if not args or not os.path.isabs(args[0]):
                  fallos.append(f"{f}: ProgramArguments[0] no es una ruta absoluta ({args[:1]}); launchd no tiene cwd")

              if ".runner-" in lab:
                  slot = lab.rsplit("-", 1)[1]
                  esperado = [f"{dep}/supervisar-macos.sh", "--slot", slot,
                              "--cpu", "4", "--memoria", "12288"]
                  if args != esperado:
                      fallos.append(f"{f}: ProgramArguments {args} != {esperado}")
                  env = p.get("EnvironmentVariables", {})
                  # launchd arranca con un PATH mínimo SIN /opt/homebrew/bin: sin
                  # esto el supervisor muere con "falta 'tart'" aunque esté instalado.
                  if "/opt/homebrew/bin" not in env.get("PATH", ""):
                      fallos.append(f"{f}: el PATH del agente no lleva Homebrew ({env.get('PATH')})")
                  if p.get("WorkingDirectory") != dep:
                      fallos.append(f"{f}: WorkingDirectory={p.get('WorkingDirectory')}; el supervisor lee ./.env de ahí")
                  for k, v in (("SUPERVISAR_MONTAJE", f"{dep}/montaje"),
                               ("SUPERVISAR_LATIDOS", f"{dep}/latidos"),
                               ("SUPERVISAR_ESTADO", f"{dep}/estado"),
                               ("SUPERVISAR_CLUSTER", "mi-cluster")):
                      if env.get(k) != v:
                          fallos.append(f"{f}: {k}={env.get(k)!r} != {v!r}")
              elif lab.endswith(".vigia"):
                  if args != [f"{dep}/vigilar.sh", "--bucle"]:
                      fallos.append(f"{f}: ProgramArguments del vigía {args}")

          if len(etiquetas) != 3:
              fallos.append(f"esperaba 3 servicios (2 runners + vigía), hay {sorted(etiquetas)}")

          if fallos:
              print("FALLO en los LaunchAgents:")
              for x in fallos:
                  print("  -", x)
              sys.exit(1)
          print("ok: %d plists válidos y completos" % len(etiquetas))
          PY

      # ~/Library/LaunchAgents lo lee cualquier proceso del usuario, y `launchctl
      # print` enseña el entorno de un servicio cargado. Es la misma regla que
      # cumple deploy.sh al no pasar el PAT por argv del contenedor.
      - name: El PAT no aparece en ningún plist ni en macos-ctl.sh
        run: |
          set -eu
          cd "$RUNNER_TEMP/mac-plist/mi-cluster"
          if grep -rl 'PAT-SECRETO-abc123' LaunchAgents macos-ctl.sh 2>/dev/null | grep -q .; then
            echo "FALLO: el PAT está en un fichero que lee cualquiera:"
            grep -rl 'PAT-SECRETO-abc123' LaunchAgents macos-ctl.sh
            exit 1
          fi
          # Y sí tiene que estar donde lo leen el supervisor y el invitado, los dos a 0600.
          for f in .env montaje/access_token; do
            grep -q 'PAT-SECRETO-abc123' "$f" || { echo "FALLO: el PAT no llegó a $f"; exit 1; }
            [ "$(stat -c '%a' "$f")" = "600" ] || { echo "FALLO: $f no está a 0600 ($(stat -c '%a' "$f"))"; exit 1; }
          done
          echo "ok: el PAT solo vive en .env y montaje/access_token, a 0600"

      # EL TEST DE MÁS VALOR DEL LOTE. El slug de healthchecks.io y el censo que
      # consume vigilar-runners.mjs salen de estos nombres: si macOS y Linux los
      # componen distinto, el panel de avisos se parte en dos y nadie lo nota hasta
      # que un check queda huérfano en rojo. Se comprueba contra deploy.sh, no
      # contra una constante, y además contra el nombre que compone de verdad
      # supervisar-macos.sh (que es quien bautiza la VM y el runner).
      - name: Paridad de nombres con el camino Linux
        run: |
          set -eu
          host="$(hostname 2>/dev/null || echo runner)"
          host="${host%%.*}"
          host="$(printf '%s' "$host" | tr -c 'A-Za-z0-9_-' '-')"

          lin="$RUNNER_TEMP/par/linux"; mac="$RUNNER_TEMP/par/macos"
          rm -rf "$RUNNER_TEMP/par"; mkdir -p "$lin" "$mac"

          ( cd "$lin"; sh "$GITHUB_WORKSPACE/deploy.sh" --no-up --skip-validation \
              --token F --repo o/r --count 2 --prefix sherman --vigilar >/dev/null 2>&1 )
          ( cd "$mac"; sh "$GITHUB_WORKSPACE/deploy-macos.sh" --no-up --skip-validation \
              --token F --repo o/r --count 2 --prefix sherman --vigilar >/dev/null 2>&1 )

          python3 -m pip install --quiet pyyaml
          LIN="$lin" MAC="$mac" HOST="$host" python3 - <<'PY'
          import os, plistlib, sys, yaml

          lin, mac, host = os.environ["LIN"], os.environ["MAC"], os.environ["HOST"]

          doc = yaml.safe_load(open(f"{lin}/compose.yaml"))
          svcs, vig = doc["services"], doc["services"]["vigia"]["environment"]
          nombres_linux = [svcs[f"runner-{i}"]["environment"]["RUNNER_NAME"] for i in (1, 2)]
          check_linux = f"{vig['VIGIA_CLUSTER']}-{vig['VIGIA_HOST']}"

          p = plistlib.load(open(f"{mac}/LaunchAgents/com.gh-runner.sherman.vigia.plist", "rb"))
          e = p["EnvironmentVariables"]
          nombres_macos = e["VIGIA_RUNNERS"].split()
          check_macos = f"{e['VIGIA_CLUSTER']}-{e['VIGIA_HOST']}"

          esperados = [f"sherman-{host}-1", f"sherman-{host}-2"]
          errores = []
          if nombres_linux != esperados:
              errores.append(f"linux: {nombres_linux} != {esperados}")
          if nombres_macos != esperados:
              errores.append(f"macos: {nombres_macos} != {esperados}")
          if check_linux != f"sherman-{host}" or check_macos != f"sherman-{host}":
              errores.append(f"check: linux={check_linux} macos={check_macos} != sherman-{host}")
          if errores:
              print("FALLO: los dos caminos no nombran igual al mismo fleet:")
              for x in errores:
                  print("  -", x)
              sys.exit(1)
          print("ok: runners", nombres_macos, "· check", check_macos, "en los dos caminos")
          PY

          # La otra mitad: el censo del plist tiene que coincidir con el nombre que
          # supervisar-macos.sh compone al arrancar (VM == runner == fichero de
          # latido). Si divergen, el vigía espera a un runner que no existe y da por
          # caído a uno que late.
          cd "$mac"
          vm="$(env SUPERVISAR_MONTAJE="$mac/montaje" SUPERVISAR_LATIDOS="$mac/latidos" \
                    SUPERVISAR_ESTADO="$mac/estado" SUPERVISAR_CLUSTER=sherman \
                    sh ./supervisar-macos.sh --slot 1 --ciclos 1 --limite-job 0 2>&1 \
                | sed -n "s/.*VM y runner '\([^']*\)'.*/\1/p" | head -n1)"
          [ "$vm" = "sherman-${host}-1" ] \
            || { echo "FALLO: el supervisor bautiza la VM '$vm', el censo espera 'sherman-${host}-1'"; exit 1; }
          echo "ok: el supervisor y el censo del vigía usan el mismo nombre ($vm)"

      # No es un aviso a propósito: un aviso se ignora y el fallo sale de
      # madrugada (la tercera VM no arranca y KeepAlive la reintenta en bucle).
      - name: --count 3 aborta citando la EULA de Apple
        run: |
          set -eu
          d="$RUNNER_TEMP/tres"; rm -rf "$d"; mkdir -p "$d"; cd "$d"
          if sh "$GITHUB_WORKSPACE/deploy-macos.sh" --no-up --skip-validation \
               --token F --repo o/r --count 3 > salida.log 2>&1; then
            echo "FALLO: --count 3 salió en verde"; cat salida.log; exit 1
          fi
          grep -qi 'EULA' salida.log \
            || { echo "FALLO: aborta pero no dice que el tope es de licencia"; cat salida.log; exit 1; }
          [ -e .env ] && { echo "FALLO: abortó DESPUÉS de escribir el despliegue"; exit 1; }
          echo "ok: --count 3 en rojo, citando la EULA, y sin dejar nada escrito"

      - name: --engine sale en rojo explicando que aquí el motor es Tart
        run: |
          set -eu
          d="$RUNNER_TEMP/eng"; rm -rf "$d"; mkdir -p "$d"; cd "$d"
          if sh "$GITHUB_WORKSPACE/deploy-macos.sh" --no-up --skip-validation \
               --token F --repo o/r --engine podman > salida.log 2>&1; then
            echo "FALLO: --engine podman se aceptó en silencio"; cat salida.log; exit 1
          fi
          grep -qi 'tart' salida.log \
            || { echo "FALLO: rechaza --engine pero no dice cuál es el motor aquí"; cat salida.log; exit 1; }
          echo "ok: --engine rechazado con explicación"

      # Un plist es XML y aquí se interpolan valores libres (prefijo, etiquetas,
      # rutas). Un solo '&' sin escapar deja el fichero mal formado y launchd se
      # niega a cargar el servicio sin decir por qué.
      - name: Una etiqueta con & o < no rompe el plist
        run: |
          set -eu
          d="$RUNNER_TEMP/xml"; rm -rf "$d"; mkdir -p "$d"; cd "$d"
          sh "$GITHUB_WORKSPACE/deploy-macos.sh" --no-up --skip-validation \
            --token F --repo o/r --count 1 --vigilar \
            --prefix 'a&b<c' --labels 'x&y<z"q' >/dev/null 2>&1
          python3 - <<'PY'
          import glob, plistlib, sys
          ficheros = glob.glob("LaunchAgents/*.plist")
          assert ficheros, "no se generó ningún plist"
          for f in ficheros:
              with open(f, "rb") as fh:
                  p = plistlib.load(fh)      # sin escapado XML, esto revienta
              lab = p["Label"]
              if "a&b<c" not in lab:
                  print(f"FALLO: {f}: el valor llegó alterado ({lab})"); sys.exit(1)
          p = plistlib.load(open("LaunchAgents/com.gh-runner.a&b<c.vigia.plist", "rb"))
          censo = p["EnvironmentVariables"]["VIGIA_RUNNERS"]
          if not censo.startswith("a&b<c-"):
              print(f"FALLO: censo alterado ({censo})"); sys.exit(1)
          print("ok: %d plists con '&' y '<' siguen parseando" % len(ficheros))
          PY
          # Las etiquetas van al .env, no al plist, y tienen que llegar verbatim:
          # el invitado se las pasa tal cual a config.sh.
          grep -qx 'RUNNER_LABELS=x&y<z"q' .env \
            || { echo "FALLO: --labels no llegó intacta al .env"; grep RUNNER_LABELS .env; exit 1; }

      # configurar-avisos.sh de los repos consumidores copia UN fichero a
      # ./vigia/avisos.conf y los hooks a ./vigia/hooks.d. Si macOS dejara esa
      # carpeta con otra forma, ese script seguiría saliendo en verde y el fleet
      # se quedaría sin avisos, en silencio.
      - name: ./vigia queda con la misma forma que en el camino Linux
        run: |
          set -eu
          lin="$RUNNER_TEMP/par/linux"; mac="$RUNNER_TEMP/par/macos"
          diff -u <(cd "$lin" && find vigia | sort) <(cd "$mac" && find vigia | sort) \
            || { echo "FALLO: ./vigia no tiene la misma forma en los dos caminos"; exit 1; }
          [ -d "$mac/vigia/hooks.d" ] || { echo "FALLO: falta ./vigia/hooks.d"; exit 1; }
          [ "$(stat -c '%a' "$mac/vigia")" = "700" ] \
            || { echo "FALLO: ./vigia no está a 700 y ahí van credenciales"; exit 1; }
          # El vigía de macOS corre en el host, así que los hooks NO pueden usar su
          # ruta por defecto (la que tenían montada dentro del contenedor).
          python3 - <<PY
          import plistlib, re, sys
          e = plistlib.load(open("$mac/LaunchAgents/com.gh-runner.sherman.vigia.plist", "rb"))["EnvironmentVariables"]
          assert e["VIGIA_HOOKS"] == "$mac/vigia/hooks.d", e["VIGIA_HOOKS"]
          assert e["VIGILAR_CONF"] == "$mac/vigia/avisos.conf", e["VIGILAR_CONF"]
          assert e["VIGIA_LATIDOS"] == "$mac/latidos", e["VIGIA_LATIDOS"]

          # Y NINGUNA de las que el camino Linux le pasa al servicio 'vigia' puede
          # faltar aquí: se leen de deploy.sh, no de una lista escrita a mano, para
          # que añadir una allí y olvidarla aquí salga en rojo. El grep del job
          # deploy-ps1 mira el TEXTO de los scripts; esto mira el plist ya generado,
          # que es lo que launchd le entrega de verdad al vigía.
          fuente = open("$GITHUB_WORKSPACE/deploy.sh").read()
          esperadas = set(re.findall(r"VIGIA_[A-Z_]+", fuente))
          faltan = sorted(esperadas - set(e))
          if faltan:
              print("FALLO: el plist del vigía no le pasa", faltan)
              sys.exit(1)
          print("ok: el vigía del host apunta a ./vigia, a ./latidos y recibe", len(esperadas), "variables como en Linux")
          PY

      # Un directorio no puede ser las dos cosas: los runners se llamarían igual y,
      # como config.sh usa --replace, se robarían el registro entre sí en bucle.
      - name: Ningún deploy pisa el despliegue del otro camino
        run: |
          set -eu
          d="$RUNNER_TEMP/cruz"; rm -rf "$d"; mkdir -p "$d/mac" "$d/lin"

          ( cd "$d/mac"; sh "$GITHUB_WORKSPACE/deploy-macos.sh" --no-up --skip-validation \
              --token F --repo o/r >/dev/null 2>&1 )
          ( cd "$d/mac"; sh "$GITHUB_WORKSPACE/deploy.sh" --no-up --skip-validation \
              --token F --repo o/r > salida.log 2>&1 ) \
            && { echo "FALLO: deploy.sh pisó un despliegue de macOS"; exit 1; }

          ( cd "$d/lin"; sh "$GITHUB_WORKSPACE/deploy.sh" --no-up --skip-validation \
              --token F --repo o/r >/dev/null 2>&1 )
          ( cd "$d/lin"; sh "$GITHUB_WORKSPACE/deploy-macos.sh" --no-up --skip-validation \
              --token F --repo o/r > salida.log 2>&1 ) \
            && { echo "FALLO: deploy-macos.sh pisó un despliegue de Linux"; exit 1; }
          grep -q 'LINUX' "$d/lin/salida.log" \
            || { echo "FALLO: no explica de quién es el directorio"; cat "$d/lin/salida.log"; exit 1; }
          echo "ok: cada camino respeta el directorio del otro (salvo --force)"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stub podman en el PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/podman" <<'STUB'
          #!/bin/sh
          # Stub mínimo: satisface la detección `podman compose version`.
          if [ "$1" = "compose" ] && [ "$2" = "version" ]; then echo "stub"; exit 0; fi
          exit 0
          STUB
          chmod +x "$RUNNER_TEMP/bin/podman"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Genera el compose (sin red, sin levantar)
        run: |
          sh ./deploy.sh --no-up --skip-validation \
            --token FAKE --repo owner/repo --count 2 --cpus 2 --memory 2g --secret
      - name: Valida compose.yaml (YAML + merge del anchor)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, sys
          with open("compose.yaml") as f:
              doc = yaml.safe_load(f)          # PyYAML resuelve las merge keys <<
          svcs = doc["services"]
          assert set(svcs) == {"runner-1", "runner-2"}, svcs
          for name, s in svcs.items():
              assert s.get("image"), f"{name}: image no fusionada"
              assert s.get("restart") == "always", f"{name}: restart no fusionado"
              assert "env_file" in s, f"{name}: env_file no fusionado"
              assert s.get("secrets") == ["access_token"], f"{name}: secrets no fusionado"
              assert s["deploy"]["resources"]["limits"]["cpus"] == "2", f"{name}: cpus"
          assert doc["secrets"]["access_token"]["file"] == "./access_token"
          print("compose.yaml OK:", list(svcs))
          PY

      # La vigilancia vive en el HOST y en la imagen, nunca en el compose: ni un
      # servicio extra, ni un volumen, ni el socket de podman montado. Esto lo
      # fija, porque es lo que hace que activarla no pueda romper un despliegue
      # existente ni dependa de que el proveedor de compose soporte tal bloque.

      # El compose por defecto NO debe cambiar (la asercion de arriba lo fija).
      # Con --vigilar aparece el vigia, y lo que importa es que quede BIEN
      # cableado: sin el volumen compartido no ve nada, y sin user 0:0 no puede
      # leer su propia configuracion en podman rootless.
      - name: Con --vigilar, el compose cablea el vigía
        run: |
          set -eu
          d="$RUNNER_TEMP/vig-compose"; rm -rf "$d"; mkdir -p "$d"; cd "$d"
          sh "$GITHUB_WORKSPACE/deploy.sh" --no-up --skip-validation \
            --token FAKE --repo owner/repo --count 3 --vigilar >/dev/null 2>&1
          python3 - <<'PY'
          import yaml
          doc = yaml.safe_load(open("compose.yaml"))
          svcs, vols = doc["services"], doc["volumes"]
          assert "vigia" in svcs, svcs
          v = svcs["vigia"]
          assert v["user"] == "0:0", ("sin esto no lee ./vigia en rootless", v)
          assert v["command"] == ["--bucle"], v
          # El vigia solo LEE los latidos; los runners los escriben.
          assert "latidos:/var/lib/gh-runner/latidos:ro" in v["volumes"], v["volumes"]
          # La `z` NO es cosmetica: sin ella, en Linux con SELinux en enforcing el
          # contenedor no puede leer este bind mount y el vigia se queda SIN AVISOS
          # en silencio (medido en Fedora: "Permission denied" dentro, "No hay
          # hooks ejecutables" en el informe, y el check verde en el panel porque
          # lo pingaba otra cosa). Los volumenes CON NOMBRE no la necesitan: los
          # etiqueta el motor al crearlos.
          assert "./vigia:/etc/gh-runner/vigia:ro,z" in v["volumes"], v["volumes"]
          for n in ("latidos", "vigia-estado"):
              assert n in vols, (n, vols)
          for i in (1, 2, 3):
              r = svcs[f"runner-{i}"]["volumes"]
              assert "latidos:/var/lib/gh-runner/latidos" in r, (i, r)
          # El censo es explicito: "no hay latido" solo significa algo si sabes
          # a quien esperabas.
          censo = v["environment"]["VIGIA_RUNNERS"].split()
          assert len(censo) == 3, censo
          # La identidad sale del directorio, que es lo que separa dos clusters
          # de una misma maquina.
          assert v["environment"]["VIGIA_CLUSTER"] == "vig-compose", v["environment"]
          assert all(c.startswith("vig-compose-") for c in censo), censo
          print("ok: vigia cableado, censo explicito e identidad por directorio")
          PY
      # El servicio del vigía lo añade --vigilar y NADA MÁS (eso lo fija el test
      # de arriba). Aquí se comprueba lo complementario: sus ajustes por sí solos
      # no cambian el compose, así que quien no active la vigilancia no ve ni una
      # línea distinta.
      - name: Los ajustes del vigía, sin --vigilar, no cambian el compose
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/cmp"
          cp compose.yaml "$RUNNER_TEMP/cmp/base.yaml"
          for extra in "--no-host-label" "--vigilar-cada 2min" "--vigilar-minimo 2"; do
            rm -f compose.yaml .env access_token
            # shellcheck disable=SC2086
            sh ./deploy.sh --no-up --skip-validation \
              --token FAKE --repo owner/repo --count 2 --cpus 2 --memory 2g --secret $extra >/dev/null 2>&1
            diff -u "$RUNNER_TEMP/cmp/base.yaml" compose.yaml \
              || { echo "FALLO: '$extra' cambió el compose"; exit 1; }
          done
          echo "ok: sin --vigilar el compose no cambia ni una línea"

      # La etiqueta de host va en su PROPIA variable. Si se colara dentro de
      # RUNNER_LABELS, borraría el default del entrypoint en los despliegues sin
      # --labels y un `runs-on: [self-hosted, ubuntu-24.04]` dejaría de casar.
      - name: La etiqueta de host es aditiva
        run: |
          set -eu
          rm -f compose.yaml .env access_token
          sh ./deploy.sh --no-up --skip-validation --token FAKE --repo o/r >/dev/null 2>&1
          grep -q '^RUNNER_HOST_LABEL=host:' .env || { echo "FALLO: falta la etiqueta de host"; exit 1; }
          grep -q '^RUNNER_LABELS='          .env && { echo "FALLO: la etiqueta se coló en RUNNER_LABELS"; exit 1; }

          rm -f compose.yaml .env
          sh ./deploy.sh --no-up --skip-validation --token FAKE --repo o/r --labels sherman >/dev/null 2>&1
          grep -qx 'RUNNER_LABELS=sherman' .env || { echo "FALLO: --labels no llegó intacta"; exit 1; }
          grep -q  '^RUNNER_HOST_LABEL=host:' .env || { echo "FALLO: falta la etiqueta de host"; exit 1; }

          rm -f compose.yaml .env
          sh ./deploy.sh --no-up --skip-validation --token FAKE --repo o/r --no-host-label >/dev/null 2>&1
          grep -q '^RUNNER_HOST_LABEL=' .env && { echo "FALLO: --no-host-label no la quitó"; exit 1; }
          echo "ok: etiqueta de host aditiva y desactivable"

  # deploy.ps1 no lo tocaba ninguna prueba, y se notó: la función que baja los
  # hooks del vigía (`Get-DelRepo`) desapareció al containerizar el vigía y su
  # llamada se quedó. En Windows eso no rompía el despliegue —el script corre con
  # ErrorActionPreference 'Continue'—: dejaba `.\vigia\hooks.d` vacío y el fleet
  # sin avisos, que es el fallo que no se ve. Estas dos comprobaciones son
  # baratas (pwsh viene en el runner) y cierran esa clase entera.
  deploy-ps1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sintaxis, y ninguna función llamada que no exista
        shell: pwsh
        run: |
          $tokens = $null; $errores = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path ./deploy.ps1).Path, [ref]$tokens, [ref]$errores)
          if ($errores) {
              $errores | ForEach-Object { Write-Output "FALLO (sintaxis): $($_.Extent.StartLineNumber): $($_.Message)" }
              exit 1
          }
          $definidas = $ast.FindAll({ param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true).Name
          $llamadas = $ast.FindAll({ param($n)
              $n -is [System.Management.Automation.Language.CommandAst] }, $true) |
              ForEach-Object { $_.GetCommandName() } | Where-Object { $_ }
          # Solo nombres con forma Verbo-Nombre: los comandos nativos del sistema
          # (podman, docker, icacls) no se pueden resolver en Linux y darían falsos
          # positivos. Un helper interno del script siempre tiene esta forma.
          $faltan = $llamadas | Sort-Object -Unique | Where-Object {
              $_ -match '^[A-Z][a-zA-Z]*-[A-Za-z]+$' -and
              $definidas -notcontains $_ -and
              -not (Get-Command $_ -ErrorAction SilentlyContinue)
          }
          if ($faltan) {
              Write-Output "FALLO: deploy.ps1 llama a funciones que no existen:"
              $faltan | ForEach-Object { Write-Output "  - $_" }
              exit 1
          }
          Write-Output "ok: deploy.ps1 parsea y no llama a nada inexistente"

      # Los TRES deploy montan el mismo vigía, y el vigía lee su identidad de estas
      # variables. Si una falta en un camino, ese sistema operativo se queda con un
      # vigía mal identificado (VIGIA_HOST ya faltaba en Windows: sin él, el nombre
      # del check salía del ID del contenedor y cambiaba en cada recreate, así que
      # cada arranque estrenaba check y el anterior quedaba huérfano y en rojo).
      #
      # deploy-macos.sh emite además las rutas de trabajo del vigía, y ESO es
      # correcto: en Linux y Windows el vigía es un contenedor y esas rutas son las
      # de dentro de la imagen (sus valores por defecto), mientras que en el Mac
      # corre en el host y hay que decírselas. Van en una lista blanca explícita
      # para que añadir una quinta no pase inadvertida.
      - name: Los tres deploy emiten las mismas variables del vigía
        run: |
          set -eu
          claves() { grep -oE 'VIGIA_[A-Z_]+' "$1" | sort -u; }
          # Rutas que solo tienen sentido con el vigía corriendo en el host macOS.
          SOLO_MACOS='VIGIA_LATIDOS|VIGIA_HOOKS|VIGIA_ESTADO_FILE|VIGIA_DISCO_RUTA'

          sh_keys="$(claves deploy.sh)"
          ps_keys="$(claves deploy.ps1)"
          mac_keys="$(claves deploy-macos.sh | grep -Ev "^(${SOLO_MACOS})$" || true)"

          for otro in ps mac; do
            eval "otras=\$${otro}_keys"
            [ "$sh_keys" = "$otras" ] && continue
            echo "FALLO: deploy.sh y deploy-${otro} no emiten las mismas VIGIA_*:"
            diff -u <(printf '%s\n' "$sh_keys") <(printf '%s\n' "$otras") || true
            exit 1
          done
          echo "ok: paridad de variables del vigía entre los tres deploy"
